<section class="section"><article class="card" id="mode511"><h2>Crossmode experimental</h2><p class="muted">Um modo por vez. D-Star não participa. Compatibilidade RF ainda não verificada; YSF → P25 usa VW. Em DMR → YSF, use TG 9 no rádio.</p><label>Conversão<select id="cmMode511"><option value="dmr2ysf">DMR → YSF</option><option value="ysf2dmr">YSF → DMR</option><option value="dmr2nxdn">DMR → NXDN</option><option value="ysf2nxdn">YSF → NXDN</option><option value="ysf2p25">YSF → P25</option></select></label><label>Destino<select id="cmDest511"></select><input id="cmTG511" type="number" min="1" max="16777215" placeholder="TG DMR" hidden></label><div class="actions"><button class="btn primary" id="cmStart511">Ativar crossmode</button><button class="btn" id="cmOff511">Voltar ao modo normal</button></div><p id="cmStatus511" role="status"></p><p class="muted">O perfil de rádio deve estar no modo de origem. Os demais parâmetros RF são preservados. Após reiniciar, o perfil normal retorna por segurança.</p></article></section>
