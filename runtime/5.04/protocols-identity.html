<section class="section" id="identity504"><article class="card"><h2>Indicativo e DMR ID</h2>
<p class="muted">Altera o indicativo e o ID digital do hotspot. O sistema reaplica a rádio e o protocolo atual e volta ao valor anterior se algo falhar.</p>
<div class="grid2"><label>Indicativo<input id="idCall" maxlength="16" autocapitalize="characters" autocomplete="off" placeholder="PU2PNY"></label>
<label>DMR ID<input id="idDmr" inputmode="numeric" maxlength="9" autocomplete="off" placeholder="7240000"></label></div>
<div class="row"><button class="btn primary" id="idSave" type="button">Salvar indicativo e ID</button></div>
<p id="idResult" class="statusmsg"></p></article></section>
