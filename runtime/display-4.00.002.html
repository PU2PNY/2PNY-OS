<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PU2PNY-OS</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--card:#121b25;--line:#273748;--text:#edf4fb;--muted:#9fb1c3;--accent:#5db7ff;--bad:#ff7b72;--ok:#66d9a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.top a{color:var(--accent);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select,input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d151e;color:var(--text)}input[type=range]{width:100%}.checks{display:flex;flex-wrap:wrap;gap:14px}.checks label{display:flex;align-items:center;gap:7px;color:var(--text);margin:0}.hint{color:var(--muted);font-size:13px}.status{white-space:pre-wrap;background:#091018;border:1px solid var(--line);padding:12px;border-radius:9px}.ok{color:var(--ok)}.bad{color:var(--bad)}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#06121d}button:disabled{opacity:.55;cursor:wait}@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1 style="margin:0">Display</h1><div class="hint" id="subtitle">Compatibilidade Pi-Star / WPSD</div></div><div><a href="/">Painel</a> · <a href="/helix">Helix</a></div></div>
<div class="card"><div class="grid">
<div class="full"><label id="ltype">Tipo de display</label><select id="type">
<option value="none">None</option><option value="oled3">OLED Type 3 (0.96")</option><option value="oled6">OLED Type 6 (1.3")</option><option value="nextion">Nextion</option><option value="nextion_driver">Nextion (enhanced w/driver)</option><option value="nextion_driver_modem">Nextion (enhanced w/driver, attached to modem)</option><option value="hd44780">HD44780</option><option value="tft_serial">TFT Serial</option><option value="lcdproc">LCDproc</option>
</select></div>
<div id="portBox"><label id="lport">Porta do display</label><select id="port"></select><div class="hint" id="portHint">Use modem para telas ligadas ao conector de tela do hotspot/MMDVM.</div></div>
<div id="layoutBox"><label id="llayout">Layout Nextion já gravado na tela</label><select id="layout"><option value="g4klx">G4KLX</option><option value="on7lds_l2">ON7LDS L2</option><option value="on7lds_l3">ON7LDS L3</option><option value="on7lds_l3hs">ON7LDS L3 HS</option></select></div>
<div id="brightBox"><label><span id="lbright">Brilho</span>: <b id="brightVal">50</b></label><input id="brightness" type="range" min="0" max="100" value="50"></div>
<div id="idleBox"><label><span id="lidle">Brilho em espera</span>: <b id="idleVal">20</b></label><input id="idle" type="range" min="0" max="100" value="20"></div>
<div class="full checks" id="nextionChecks"><label><input id="clock" type="checkbox" checked><span id="lclock">Mostrar relógio</span></label><label><input id="utc" type="checkbox"><span>UTC</span></label></div>
<div class="full checks" id="oledChecks"><label><input id="screensaver" type="checkbox" checked><span id="lsaver">Protetor de tela</span></label><label id="scrollWrap"><input id="scroll" type="checkbox" checked><span id="lscroll">Rolagem</span></label><label><input id="rotate" type="checkbox"><span id="lrotate">Rotacionar tela</span></label><label><input id="invert" type="checkbox"><span id="linvert">Inverter tela</span></label></div>
<div class="full checks" id="lcdChecks"><label><input id="lcdClock" type="checkbox" checked><span id="llcdclock">Mostrar relógio</span></label><label><input id="lcdUtc" type="checkbox"><span>UTC</span></label><label><input id="dim" type="checkbox"><span id="ldim">Escurecer em espera</span></label></div>
<div class="full hint" id="hmiNote">O PU2PNY-OS não grava HMI/TFT automaticamente. Escolha o layout que já está instalado na Nextion, como no Pi-Star/WPSD.</div>
</div></div>
<div class="card"><button id="apply">Aplicar configuração</button><div id="msg" style="margin-top:12px"></div></div>
<div class="card"><strong id="lstatus">Estado efetivo</strong><div class="status" id="status">—</div></div>
</main>
<script>
const $=id=>document.getElementById(id);let state={};
const dict={pt:{subtitle:'Compatibilidade Pi-Star / WPSD',ltype:'Tipo de display',lport:'Porta do display',portHint:'Use modem para telas ligadas ao conector de tela do hotspot/MMDVM.',llayout:'Layout Nextion já gravado na tela',lbright:'Brilho',lidle:'Brilho em espera',lclock:'Mostrar relógio',lsaver:'Protetor de tela',lscroll:'Rolagem',lrotate:'Rotacionar tela',linvert:'Inverter tela',llcdclock:'Mostrar relógio',ldim:'Escurecer em espera',hmiNote:'O PU2PNY-OS não grava HMI/TFT automaticamente. Escolha o layout que já está instalado na Nextion, como no Pi-Star/WPSD.',apply:'Aplicar configuração',lstatus:'Estado efetivo'},en:{subtitle:'Pi-Star / WPSD compatibility',ltype:'Display type',lport:'Display port',portHint:'Use modem for screens connected to the hotspot/MMDVM display connector.',llayout:'Nextion layout already loaded on the screen',lbright:'Brightness',lidle:'Idle brightness',lclock:'Display clock',lsaver:'Screen saver',lscroll:'Scroll display',lrotate:'Rotate display',linvert:'Invert display',llcdclock:'Display clock',ldim:'Dim on idle',hmiNote:'PU2PNY-OS does not automatically flash HMI/TFT files. Select the layout already loaded on the Nextion, as in Pi-Star/WPSD.',apply:'Apply configuration',lstatus:'Effective state'},es:{subtitle:'Compatibilidad Pi-Star / WPSD',ltype:'Tipo de pantalla',lport:'Puerto de pantalla',portHint:'Use modem para pantallas conectadas al conector del hotspot/MMDVM.',llayout:'Layout Nextion ya cargado en la pantalla',lbright:'Brillo',lidle:'Brillo en espera',lclock:'Mostrar reloj',lsaver:'Protector de pantalla',lscroll:'Desplazamiento',lrotate:'Rotar pantalla',linvert:'Invertir pantalla',llcdclock:'Mostrar reloj',ldim:'Atenuar en espera',hmiNote:'PU2PNY-OS no graba HMI/TFT automáticamente. Seleccione el layout ya cargado en la Nextion, como en Pi-Star/WPSD.',apply:'Aplicar configuración',lstatus:'Estado efectivo'}};
function lang(){const raw=localStorage.getItem('pu2pny_lang')||localStorage.getItem('language')||navigator.language||'pt';return raw.toLowerCase().startsWith('en')?'en':raw.toLowerCase().startsWith('es')?'es':'pt'}
function tr(){const d=dict[lang()];Object.entries(d).forEach(([k,v])=>{const e=$(k);if(e)e.textContent=v})}
function show(){const t=$('type').value;const nx=t.startsWith('nextion');const oled=t==='oled3'||t==='oled6';const tft=t==='tft_serial';const lcd=t==='lcdproc';$('portBox').style.display=(nx||tft)?'block':'none';$('layoutBox').style.display=nx?'block':'none';$('brightBox').style.display=(nx||oled||tft)?'block':'none';$('idleBox').style.display=nx?'block':'none';$('nextionChecks').style.display=nx?'flex':'none';$('oledChecks').style.display=oled?'flex':'none';$('scrollWrap').style.display=t==='oled3'?'flex':'none';$('lcdChecks').style.display=lcd?'flex':'none';$('hmiNote').style.display=nx?'block':'none';if(t==='nextion_driver_modem'){$('port').value='modem';$('port').disabled=true}else $('port').disabled=false;$('brightness').max=oled?'255':'100'}
function fillPorts(ports){$('port').innerHTML='';(ports&&ports.length?ports:['modem']).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;$('port').appendChild(o)})}
function setCfg(c){if(!c)return;$('type').value=c.type||'none';if(c.port&&[...$('port').options].some(o=>o.value===c.port))$('port').value=c.port;$('layout').value=c.layout||'g4klx';if(c.brightness!=null)$('brightness').value=c.brightness;if(c.idle_brightness!=null)$('idle').value=c.idle_brightness;$('clock').checked=c.display_clock!==false;$('utc').checked=!!c.utc;$('screensaver').checked=c.screensaver!==false;$('scroll').checked=!!c.scroll;$('rotate').checked=!!c.rotate;$('invert').checked=!!c.invert;$('lcdClock').checked=c.display_clock!==false;$('lcdUtc').checked=!!c.utc;$('dim').checked=!!c.dim_on_idle;sync();show()}
function sync(){$('brightVal').textContent=$('brightness').value;$('idleVal').textContent=$('idle').value}
async function load(){try{const r=await fetch('/api/display/config',{cache:'no-store'});state=await r.json();fillPorts(state.available_ports);setCfg(state.config);$('status').textContent=JSON.stringify(state,null,2)}catch(e){$('status').textContent=String(e)}}
function payload(){const t=$('type').value;const p={type:t};if(t.startsWith('nextion'))Object.assign(p,{port:t==='nextion_driver_modem'?'modem':$('port').value,layout:$('layout').value,brightness:+$('brightness').value,idle_brightness:+$('idle').value,display_clock:$('clock').checked,utc:$('utc').checked});else if(t==='oled3'||t==='oled6')Object.assign(p,{brightness:+$('brightness').value,screensaver:$('screensaver').checked,scroll:t==='oled3'&&$('scroll').checked,rotate:$('rotate').checked,invert:$('invert').checked});else if(t==='tft_serial')Object.assign(p,{port:$('port').value,brightness:+$('brightness').value});else if(t==='lcdproc')Object.assign(p,{display_clock:$('lcdClock').checked,utc:$('lcdUtc').checked,dim_on_idle:$('dim').checked});return p}
async function apply(){const b=$('apply');b.disabled=true;$('msg').textContent='…';try{const r=await fetch('/api/display/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const j=await r.json();$('msg').className=j.ok?'ok':'bad';$('msg').textContent=j.ok?'OK — configuração aplicada; validação física ainda pendente.':(j.error||'Erro')+(j.detail?' — '+j.detail:'');await load()}catch(e){$('msg').className='bad';$('msg').textContent=String(e)}finally{b.disabled=false}}
$('type').addEventListener('change',show);$('brightness').addEventListener('input',sync);$('idle').addEventListener('input',sync);$('apply').addEventListener('click',apply);tr();show();load();
</script></body></html>
