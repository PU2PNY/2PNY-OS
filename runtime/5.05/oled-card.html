<section class="section" id="oledcard505"><article class="card"><h2>Tela OLED / LCD (I2C)</h2>

<label>Tamanho<select id="oledSize"><option value="64">OLED 128x64</option><option value="32">OLED 128x32</option><option value="20x4">LCD 20x4</option><option value="16x2">LCD 16x2</option></select></label></div>
<div class="row"><button class="btn primary" id="oledSave" type="button">Aplicar</button></div>
