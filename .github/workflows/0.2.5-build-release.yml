name: Build and release PU2PNY 0.2.5 Alpha

on:
  push:
    branches: [ pu2pny-os-0.2.5-alpha ]
    paths:
      - 'src/2pnyd-main-0.2.5.go'
      - 'src/2pny-network-core-0.2.5'
      - 'src/2pny-network-switch-0.2.5'
      - 'src/2pny-hostfiles-update-0.2.5'
      - 'src/2pny-server-catalog-0.2.5.py'
      - 'src/2pny-protocol-network-apply-0.2.5'
      - 'src/2pny-live-status-0.2.5.py'
      - 'src/2pny-auto-maintenance-0.2.5'
      - 'src/wizard-0.2.5.html'
      - 'src/dashboard-0.2.5.html'
      - 'ci/prepare-0.2.5-protocol-network.py'
      - 'ci/validate-0.2.5-image.sh'
      - '.github/workflows/0.2.5-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    env:
      VERSION: 0.2.5-alpha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Restore baseline and apply PU2PNY patches
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in             ci/prepare-0.1.2.sh             ci/prepare-0.1.3.sh             ci/prepare-0.1.4-ui.sh             ci/prepare-0.1.5-hardware.sh             ci/prepare-0.1.5-fixes.sh             ci/prepare-0.1.6-rf.sh             ci/prepare-0.1.6-build-fix.sh             ci/prepare-0.1.7-modules.sh             ci/prepare-0.1.7-hotfix1-ethernet.sh             ci/prepare-0.1.7-hotfix2-listener-prep.sh             ci/prepare-0.1.7-hotfix2-captive-responsive.sh             ci/prepare-0.1.7-hotfix2-review-fixes.sh             ci/prepare-0.1.7-hotfix2-route-dedupe.sh             ci/prepare-0.1.7-hotfix3-network-stability.sh             ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh             ci/prepare-0.1.7-hotfix4-dual-network.sh             ci/prepare-0.1.7-hotfix4-validator-fix.sh             ci/prepare-0.1.7-hotfix5-bookworm-network.sh             ci/prepare-0.1.7-hotfix5-base-fix.sh             ci/prepare-0.1.7-hotfix5-validator-compat.sh             ci/prepare-0.1.8-anchor-compat.sh             ci/prepare-0.1.8-network-core.sh             ci/prepare-0.1.8-builder-service-fix.sh             ci/prepare-0.1.9-pu2pny-hardware-ui.sh             ci/prepare-0.1.9-network-pid-fix.sh             ci/prepare-0.1.9-build-metadata-fix.sh             ci/prepare-0.1.9-hotfix1-hardware-status.sh             ci/prepare-0.2.0-onboarding.sh             ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os

      - name: Validate 0.2.5 source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          for f in             rootfs-overlay/usr/local/sbin/2pny-network-core             rootfs-overlay/usr/local/sbin/2pny-network-switch             rootfs-overlay/usr/local/sbin/2pny-hostfiles-update             rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply             rootfs-overlay/usr/local/sbin/2pny-auto-maintenance             rootfs-overlay/usr/local/sbin/2pny-rf-apply             rootfs-overlay/usr/local/sbin/2pny-mode-apply; do
              bash -n "$f"
          done
          python3 -m py_compile             rootfs-overlay/usr/local/sbin/2pny-server-catalog             rootfs-overlay/usr/local/sbin/2pny-live-status             rootfs-overlay/usr/local/sbin/2pny-hardware-probe             rootfs-overlay/usr/local/sbin/2pny-display-status
          rm -rf rootfs-overlay/usr/local/sbin/__pycache__
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.2\.5-alpha"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/servers"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/live"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/display/override"' src/2pnyd/main.go
          grep -Fq 'selecione um servidor/master DMR válido' src/2pnyd/main.go
          ! grep -Fq 'systemctl stop 2pny-network-core.service' rootfs-overlay/usr/local/sbin/2pny-network-switch
          grep -Fq 'PU2PNY-WIFI-CANDIDATE' rootfs-overlay/usr/local/sbin/2pny-network-switch
          grep -Fq 'ap-scan-hold' rootfs-overlay/usr/local/sbin/2pny-network-core
          grep -Fq '"DMR Network"' rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply
          grep -Fq '"Enable":"1"' rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply
          grep -Fq 'Servidor DMR' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq 'confirmNextion' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq '/api/servers' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq '/api/live' rootfs-overlay/usr/share/2pny/dashboard.html
          grep -Fq 'liveBer' rootfs-overlay/usr/share/2pny/dashboard.html
          test -s rootfs-overlay/var/lib/2pny/hosts/DMR_Hosts.txt

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"

      - name: Validate final 0.2.5 image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.2.5-image.sh" "dist/PU2PNY-$VERSION-arm64.img.xz" "$VERSION"

      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-0.2.5-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-x64:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.2.5-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-0.2.5-arm64
          path: release

      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-$VERSION-arm64.img.xz"
          CHECKSUM="$IMAGE.sha256"
          xz -t "$IMAGE"
          EXPECTED="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY 0.2.5 Alpha — Raspberry Pi ARM64.

          Principais correções e recursos:
          - corrigida a busca Wi-Fi para não derrubar o núcleo Ethernet durante scan/associação;
          - em placa Wi-Fi única, apenas o AP é pausado; cabo Ethernet continua operacional;
          - senha/rede candidata só substitui o perfil anterior após conexão e IPv4 válidos;
          - interface deixa de mostrar checkbox impossível em hardware com uma única placa Wi-Fi;
          - DMR agora exige um master/servidor real antes de finalizar a configuração;
          - lista pública pesquisável de masters/servidores com cache local e atualização automática;
          - presets iniciais incluem XLX026, BrandMeister Brasil e TGIF;
          - MMDVMHost recebe [DMR Network] real com Address, Port, Password, Color Code e slots;
          - rollback se a aplicação da rede DMR derrubar o MMDVMHost;
          - painel principal preservado e ampliado com servidor, estado da rede digital e atividade ao vivo;
          - TX/RX DMR, origem, destino/TG, slot, duração, BER e RSSI são exibidos quando presentes no log do MMDVMHost;
          - polling adaptativo: 2,5 s com painel visível e 10 s em segundo plano;
          - Nextion continua sendo marcada como confirmada apenas quando responde ao protocolo; nenhum HMI é sobrescrito automaticamente.

          Escopo desta Alpha:
          - DMR possui configuração de rede externa operacional.
          - Catálogos D-Star/YSF/P25/NXDN já estão preparados, mas gateways externos completos desses protocolos entram nos módulos seguintes.
          - Crossmode completo continua no roadmap e não é apresentado como pronto.

          Acessos:
          AP pu2pny / cabo direto: http://10.43.0.1/
          Rede normal: http://pu2pny.local/
          Painel: http://pu2pny.local/dashboard
          Assistente: http://pu2pny.local/wizard
          EOF

      - name: Publish verified prerelease and assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.5-alpha
          target_commitish: pu2pny-os-0.2.5-alpha
          name: PU2PNY 0.2.5 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-0.2.5-alpha-arm64.img.xz
            release/PU2PNY-0.2.5-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
