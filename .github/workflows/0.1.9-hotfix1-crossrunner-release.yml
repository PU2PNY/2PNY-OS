name: Cross-runner publish PU2PNY OS 0.1.9 Hotfix1

on:
  push:
    branches: [ pu2pny-os-0.1.9-hotfix1 ]
    paths:
      - '.github/workflows/0.1.9-hotfix1-crossrunner-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      VERSION: 0.1.9-hotfix1-alpha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Restore, patch and validate source
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh; do
              bash "$f" legacy-source/2pny-os
          done
          cd legacy-source/2pny-os
          gofmt -w src/2pnyd/main.go
          go test ./...
          python3 -m py_compile rootfs-overlay/usr/local/sbin/2pny-hardware-probe
          rm -rf rootfs-overlay/usr/local/sbin/__pycache__
          grep -Fq "fetch('/api/hardware/status'" src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/hardware/status", hardwareStatusHandler)' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/hardware", hardwareHandler)' src/2pnyd/main.go
          grep -Fq 'candidate_reason' rootfs-overlay/usr/local/sbin/2pny-hardware-probe

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Normalize image name and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-OS-${VERSION}-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          sudo sha256sum "$IMAGE" | sudo tee "${IMAGE}.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          sha256sum -c "${IMAGE}.sha256"

      - name: Validate final image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.9-image.sh" "dist/PU2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Stage release artifact
        working-directory: legacy-source/2pny-os
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-OS-${VERSION}-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-OS-${VERSION}-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.1.9-hotfix1-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-x64:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: 0.1.9-hotfix1-alpha
      TAG: v0.1.9-hotfix1-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.1.9-hotfix1-arm64
          path: release

      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-${VERSION}-arm64.img.xz"
          test -s "$IMAGE"
          xz -t "$IMAGE"
          (cd release && sha256sum -c "PU2PNY-OS-${VERSION}-arm64.img.xz.sha256")

      - name: Publish release from x64 runner
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-${VERSION}-arm64.img.xz"
          CHECKSUM="${IMAGE}.sha256"
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY OS 0.1.9 Hotfix1 Alpha — Raspberry Pi 4 ARM64.

          Hardware detection hotfix validated in the final image:
          - wizard uses /api/hardware/status for the new hardware state machine;
          - legacy /api/hardware remains available for compatibility;
          - Raspberry model, serial ports, HAT and I2C are exposed independently of MMDVM serial probing;
          - /dev/serial0 is treated as a candidate, never as a false-positive MMDVM;
          - responsive UI, open setup AP, direct Ethernet, RF rollback, MMDVMHost and DMR Talker Alias are preserved.

          First access:
          Wi-Fi: 2PNY-SETUP -> http://10.42.0.1
          Direct Ethernet: http://10.43.0.1
          Normal LAN: http://pu2pny.local
          EOF

          for rid in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || true); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$rid" >/dev/null || true
          done
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'PU2PNY OS 0.1.9 Hotfix1 Alpha' --notes-file RELEASE-NOTES.md --prerelease

          ok=0
          for attempt in 1 2 3; do
            echo "large asset upload attempt $attempt"
            if timeout 600s gh release upload "$TAG" "$IMAGE" --repo "$GITHUB_REPOSITORY" --clobber; then ok=1; break; fi
            sleep 8
          done
          if [[ "$ok" != 1 ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            exit 1
          fi

          gh release upload "$TAG" "$CHECKSUM" release/BUILD-INFO.txt --repo "$GITHUB_REPOSITORY" --clobber

          LOCAL_SIZE="$(stat -c%s "$IMAGE")"
          LOCAL_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          REMOTE_SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$(basename "$IMAGE")\") | .size")"
          REMOTE_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$(basename "$IMAGE")\") | .digest")"
          test "$REMOTE_SIZE" = "$LOCAL_SIZE"
          if [[ -n "$REMOTE_DIGEST" && "$REMOTE_DIGEST" != "null" ]]; then test "$REMOTE_DIGEST" = "sha256:$LOCAL_SHA"; fi
          echo "release asset verified: size=$REMOTE_SIZE sha256=$LOCAL_SHA"
