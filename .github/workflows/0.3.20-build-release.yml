name: Build and release PU2PNY-OS 0.3.20 Alpha

on:
  push:
    branches: [ pu2pny-os-0.3.20-alpha ]
    paths:
      - 'src/**'
      - 'ci/**'
      - '.github/workflows/0.3.20-build-release.yml'
      - 'PU2PNY-OS_*.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pu2pny-os-0.3.20-alpha-release
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate protected baseline and 0.3.20 sources
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd-main-0.3.20.go src/direct-core/*.go
          go test src/2pnyd-main-0.3.20.go
          go test src/direct-core/*.go
          python3 ci/test-0.3.19-regressions.py
          python3 ci/test-0.3.20-regressions.py
          python3 -m py_compile             src/2pny-display-detector-0.3.20.py             src/2pny-display-apply-0.3.20.py             src/2pny-display-core-0.3.20.py             src/2pny-protocol-network-apply-all-0.3.20.py             src/2pny-protocol-network-apply-0.3.20.py             src/2pny-protocol-profiles-0.3.20.py             src/2pny-station-worker-0.3.20.py             src/2pny-aprs-0.3.20.py             src/2pny-update-manager-0.3.20.py             src/2pny-timezone-apply-0.3.20.py             ci/patch-dmrgateway-pu2pny-0.3.20.py             ci/prepare-0.3.20-alpha.py
          bash -n src/2pny-display-online-detect-0.3.20 src/2pny-hostfiles-update-0.3.20 ci/validate-0.3.20-image.sh
          node --check src/ui-common-0.3.20.js
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['src/internet-0.3.20.html','src/hotspot-0.3.20.html','src/dashboard-0.3.20.html','src/aprs-0.3.20.html','src/system-0.3.20.html','src/display-0.3.20.html']){
            const h=fs.readFileSync(f,'utf8');
            for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
          }
          NODE
          grep -Fq 'B (padrão PU2PNY)' src/hotspot-0.3.20.html
          grep -Fq 'DSTAR_LOCAL=' src/2pny-protocol-network-apply-all-0.3.20.py
          grep -Fq 'XLXHosts.txt' src/2pny-protocol-network-apply-all-0.3.20.py
          grep -Fq 'requested_server' src/2pny-station-worker-0.3.20.py
          grep -Fq '(slotNo == 1U || slotNo == 2U)' ci/patch-dmrgateway-pu2pny-0.3.20.py

  build-arm64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: 0.3.20-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2 parted
      - name: Restore 0.3.19 baseline and apply focused 0.3.20 overlay
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in             ci/prepare-0.1.2.sh             ci/prepare-0.1.3.sh             ci/prepare-0.1.4-ui.sh             ci/prepare-0.1.5-hardware.sh             ci/prepare-0.1.5-fixes.sh             ci/prepare-0.1.6-rf.sh             ci/prepare-0.1.6-build-fix.sh             ci/prepare-0.1.7-modules.sh             ci/prepare-0.1.7-hotfix1-ethernet.sh             ci/prepare-0.1.7-hotfix2-listener-prep.sh             ci/prepare-0.1.7-hotfix2-captive-responsive.sh             ci/prepare-0.1.7-hotfix2-review-fixes.sh             ci/prepare-0.1.7-hotfix2-route-dedupe.sh             ci/prepare-0.1.7-hotfix3-network-stability.sh             ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh             ci/prepare-0.1.7-hotfix4-dual-network.sh             ci/prepare-0.1.7-hotfix4-validator-fix.sh             ci/prepare-0.1.7-hotfix5-bookworm-network.sh             ci/prepare-0.1.7-hotfix5-base-fix.sh             ci/prepare-0.1.7-hotfix5-validator-compat.sh             ci/prepare-0.1.8-anchor-compat.sh             ci/prepare-0.1.8-network-core.sh             ci/prepare-0.1.8-builder-service-fix.sh             ci/prepare-0.1.9-pu2pny-hardware-ui.sh             ci/prepare-0.1.9-network-pid-fix.sh             ci/prepare-0.1.9-build-metadata-fix.sh             ci/prepare-0.1.9-hotfix1-hardware-status.sh             ci/prepare-0.2.0-onboarding.sh             ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os
          python3 ci/prepare-0.2.7-radio-live.py legacy-source/2pny-os
          python3 ci/prepare-0.2.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.2.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.0-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.1-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.2-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.3-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.4-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.5-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.6-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.7-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.10-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.11-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.12-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.13-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.14-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.15-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.16-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.17-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.18-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.19-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.20-alpha.py legacy-source/2pny-os
      - name: Validate staged source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          python3 -m py_compile             rootfs-overlay/usr/local/sbin/2pny-station-worker             rootfs-overlay/usr/local/sbin/2pny-display-core             rootfs-overlay/usr/local/sbin/2pny-display-apply             rootfs-overlay/usr/local/sbin/2pny-display-detector             rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply             rootfs-overlay/usr/local/sbin/2pny-protocol-profiles             rootfs-overlay/usr/local/sbin/2pny-update-manager             rootfs-overlay/usr/local/libexec/2pny-dmr-apply             rootfs-overlay/usr/local/sbin/2pny-aprs             rootfs-overlay/usr/local/sbin/2pny-timezone-apply
          bash -n rootfs-overlay/usr/local/sbin/2pny-hostfiles-update rootfs-overlay/usr/local/sbin/2pny-display-online-detect
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.3\.20-alpha"' src/2pnyd/main.go
          grep -Fq 'DSTAR_LOCAL=' rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply
          grep -Fq 'Band={dstar_local}' rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply
          grep -Fq 'XLXHosts.txt' rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply
          grep -Fq 'B (padrão PU2PNY)' rootfs-overlay/usr/share/2pny/hotspot.html
          grep -Fq 'requested_server' rootfs-overlay/usr/local/sbin/2pny-station-worker
          grep -Fq 'observeProtocolConnection' rootfs-overlay/usr/share/2pny/hotspot.html
          grep -Fq 'renderer="pu2pny-modern-v2"' rootfs-overlay/usr/local/sbin/2pny-display-apply
          grep -Fq 'host/display-out' rootfs-overlay/usr/local/sbin/2pny-display-detector
          grep -Fq 'state="rolled_back"' rootfs-overlay/usr/local/sbin/2pny-update-manager
          grep -Fq 'command=="PING"' rootfs-overlay/usr/local/sbin/2pny-aprs
          grep -Fq 'pny-real-hidden' rootfs-overlay/usr/share/2pny/ui-common-0.3.0.js
          test -x rootfs-overlay/usr/local/bin/2pny-direct-core
          rootfs-overlay/usr/local/bin/2pny-direct-core --selftest | grep -Fq DIRECT_SELFTEST_OK
          grep -Fq 'patch-dmrgateway-pu2pny-0.3.20.py' builder/build-image.sh
      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh
      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-OS-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"
      - name: Pre-validate generated image
        working-directory: legacy-source/2pny-os
        run: sudo bash "$GITHUB_WORKSPACE/ci/preflight-image.sh" "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$VERSION"
      - name: Validate final image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.3.20-image.sh" "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$VERSION"
      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.3.20-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.3.20-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.3.20-arm64
          path: release
      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          xz -t "$IMAGE"
          test "$(awk '{print $1}' "$IMAGE.sha256")" = "$(sha256sum "$IMAGE" | awk '{print $1}')"
      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY-OS 0.3.20 Alpha — manutenção focal sobre a 0.3.19-alpha.

          Principais mudanças:
          - D-Star: módulo local/RPT1 selecionável A-E, padrão PU2PNY B em novas configurações; módulo remoto permanece independente.
          - D-Star por rádio: o painel não trata pedido de link como sucesso; XLX é mesclado no catálogo local para que comandos de rádio possam ser realmente resolvidos pelo DStarGateway. REF/XRF/DCS continuam pelo catálogo D-Star embarcado.
          - DMR: XLX aparece primeiro; troca BrandMeister→XLX remove ESSID; controle TG 4000-4026/4099 é aceito nos dois timeslots RF; duplex mantém TS1/TS2 local.
          - Ao Vivo: aviso TOT 2:30 amarelo e 2:50 vermelho; S-meter só aparece com RF real.
          - UI: indicadores sem dado real ficam ocultos; estado de Internet e link remoto são separados.
          - DNS: confirmação do navegador não expira antes do backend.
          - Nextion: Moderno V2 é o layout padrão; comunicação física só é confirmada após COMOK pela bridge MQTT do MMDVMHost.
          - APRS: página renomeada para APRS e comandos PING/STATUS/LAST/MYLAST/ONLINE/MODULE/INFO/HELP usam estado local real.
          - Sistema: lista completa de timezones, ajuste manual do relógio, download de logs sanitizados.
          - OTA: instalar agora/depois e rollback automático em falha de aplicação.
          - Direct: gatilho automático por D-Star URCALL ou DMR Private ID quando o peer pareado está online no mesmo protocolo.

          Validação desta release:
          - source, regressões, ARM64, XZ/SHA-256, preflight e imagem montada são gates obrigatórios;
          - YSF simplex e DMR simplex permanecem baseline protegido;
          - RF real D-Star/DMR duplex, Nextion física, BER/RSSI reais e Direct entre dois hotspots continuam HW PENDENTE até reteste em Raspberry Pi + MMDVM.

          Estado: ALPHA / PARA TESTE FÍSICO.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.20-alpha
          target_commitish: ${{ github.sha }}
          name: PU2PNY-OS 0.3.20 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-OS-0.3.20-alpha-arm64.img.xz
            release/PU2PNY-OS-0.3.20-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
