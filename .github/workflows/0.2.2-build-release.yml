name: Build and release PU2PNY 0.2.2 Alpha

on:
  push:
    branches: [ pu2pny-os-0.2.2-alpha ]
    paths:
      - 'src/2pnyd-main-0.2.2.go'
      - 'src/2pny-network-core-0.2.2'
      - 'src/2pny-network-switch-0.2.2'
      - 'src/2pny-rf-apply-0.2.2'
      - 'src/2pny-mode-apply-0.2.2'
      - 'src/2pny-hardware-probe-0.2.2.py'
      - 'src/2pny-mmdvmhost-0.2.2.service'
      - 'src/wizard-0.2.2.html'
      - 'ci/prepare-0.2.2-stability.py'
      - 'ci/validate-0.2.2-image.sh'
      - '.github/workflows/0.2.2-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      VERSION: 0.2.2-alpha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Restore baseline and apply PU2PNY patches
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh \
            ci/prepare-0.2.0-onboarding.sh \
            ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os

      - name: Validate 0.2.2 source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          for f in \
            rootfs-overlay/usr/local/sbin/2pny-network-core \
            rootfs-overlay/usr/local/sbin/2pny-network-switch \
            rootfs-overlay/usr/local/sbin/2pny-ap-control \
            rootfs-overlay/usr/local/sbin/2pny-rf-apply \
            rootfs-overlay/usr/local/sbin/2pny-mode-apply \
            rootfs-overlay/usr/local/sbin/2pny-hardware-drivers \
            rootfs-overlay/usr/local/sbin/2pny-hardware-prepare \
            rootfs-overlay/usr/local/sbin/2pny-mdns-alias; do
              bash -n "$f"
          done
          python3 -m py_compile rootfs-overlay/usr/local/sbin/2pny-hardware-probe
          rm -rf rootfs-overlay/usr/local/sbin/__pycache__
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.2\.2-alpha"' src/2pnyd/main.go
          grep -Fq 'Name: "PU2PNY"' src/2pnyd/main.go
          grep -Fq 'time.AfterFunc(2500*time.Millisecond' src/2pnyd/main.go
          grep -Fq 'SETUP_IP=10.43.0.1' rootfs-overlay/usr/local/sbin/2pny-network-core
          grep -Fq 'nmcli --wait 14 connection up PU2PNY-WIFI' rootfs-overlay/usr/local/sbin/2pny-network-core
          ! grep -Rqs '10\.42\.0\.1' rootfs-overlay/usr/share/2pny/network rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq 'CONFIG=/var/lib/2pny/mmdvm/MMDVM-Host.ini' rootfs-overlay/usr/local/sbin/2pny-rf-apply
          grep -Fq 'Display=Nextion' rootfs-overlay/usr/local/sbin/2pny-rf-apply
          grep -Fq 'nextion_mmdvm' rootfs-overlay/usr/local/sbin/2pny-hardware-probe
          grep -Fq 'for baud in (9600, 19200, 38400, 57600, 115200, 230400, 921600)' rootfs-overlay/usr/local/sbin/2pny-hardware-probe
          grep -q '^ssid=pu2pny$' rootfs-overlay/usr/share/2pny/network/hostapd.template

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"

      - name: Validate final 0.2.2 image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.2.2-image.sh" "dist/PU2PNY-$VERSION-arm64.img.xz" "$VERSION"

      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-0.2.2-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-x64:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.2.2-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-0.2.2-arm64
          path: release

      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-$VERSION-arm64.img.xz"
          CHECKSUM="$IMAGE.sha256"
          xz -t "$IMAGE"
          EXPECTED="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY 0.2.2 Alpha — Raspberry Pi ARM64.

          Correções desta versão:
          - nome público corrigido para PU2PNY;
          - SSID do primeiro acesso: pu2pny;
          - 10.43.0.1 é o único IP de setup no AP e no cabo direto;
          - http://pu2pny.local/ é o endereço estável na rede normal;
          - Wi-Fi salvo é reconectado automaticamente antes de abrir o AP;
          - troca de Wi-Fi responde ao navegador antes de mudar a interface e retoma pelo pu2pny.local;
          - captive portal aprimorado para Android, iOS/macOS e Windows;
          - detecção ampliada para Nextion em múltiplos baud rates, Nextion via MMDVM, HDMI/DSI, USB, I2C, SPI e framebuffer;
          - configuração ativa do MMDVMHost movida para /var/lib/2pny/mmdvm;
          - eliminado o erro de sistema de arquivos somente leitura ao salvar RF;
          - Nextion via MMDVM é habilitada automaticamente quando reconhecida;
          - rollback de RF e Talker Alias preservados.

          Primeiro acesso:
          AP aberto: pu2pny -> http://10.43.0.1/
          Cabo direto -> http://10.43.0.1/
          LAN/Wi-Fi normal -> http://pu2pny.local/
          EOF

      - name: Publish verified prerelease and assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.2-alpha
          target_commitish: pu2pny-os-0.2.2-alpha
          name: PU2PNY 0.2.2 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-0.2.2-alpha-arm64.img.xz
            release/PU2PNY-0.2.2-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
