name: PU2PNY-OS 5.12.002 P2 ALPHA — DMR, ARM32 e AP 4 placas
on:
  push:
    branches: [release/pu2pny-5.12.002]
    paths:
      - '.github/workflows/5.12.002-p1-release.yml'
      - 'ci/build-5.12.2.py'
      - 'ci/patch-image-5.12.2.py'
      - 'ci/test-5.12.2.py'
      - 'runtime/5.12.2/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu2pny-5.12.002-release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Preparar pré-requisitos de teste sem RF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
      - name: Validações SW/CI de comportamento preservado
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch-image-5.12.2.py ci/build-5.12.2.py ci/test-5.12.2.py runtime/5.12.2/*.py
          python3 ci/test-5.12.1.py
          sudo groupadd --system mmdvm 2>/dev/null || true
          sudo useradd --system --gid mmdvm --no-create-home --shell /usr/sbin/nologin mmdvm 2>/dev/null || true
          sudo python3 ci/test-5.12.2.py
          python3 ci/test-expert-054.py 5.10
          python3 ci/test-boot-5.12.py
          python3 ci/test-board-5.12.py

  image:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        arch: [32, 64, opizero, nanopineo]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar somente utilitários para imagem offline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils util-linux e2fsprogs python3-pil
      - name: Baixar imagem P1 oficial já publicada
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pny5122"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 25             "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.12.001-p1/pu2pny-${ARCH}-5.12.001.img.xz"             -o "$RUNNER_TEMP/pny5122/pu2pny-${ARCH}-5.12.img.xz"
          xz -t "$RUNNER_TEMP/pny5122/pu2pny-${ARCH}-5.12.img.xz"
      - name: Aplicar P2 limitado, comparar manifesto e preservar ARM/kernel/Nextion/RF
        run: |
          set -euo pipefail
          sudo python3 ci/build-5.12.2.py "$RUNNER_TEMP/pny5122" "${{ matrix.arch }}" "$GITHUB_SHA"
      - name: Publicar artefato candidato desta arquitetura
        uses: actions/upload-artifact@v4
        with:
          name: pu2pny-5122-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pny5122/output/*.img.xz
            ${{ runner.temp }}/pny5122/output/*.img.xz.sha256
            ${{ runner.temp }}/pny5122/output/BUILD-INFO-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [tests, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reunir as quatro imagens e os checksums
        uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-5122-*
          path: artifacts
          merge-multiple: true
      - name: Confirmar quatro boards, checksum, xz, commit e restrição HW
        run: |
          set -euo pipefail
          cd artifacts
          python3 - <<'PY'
          import json,os,pathlib
          for arch in ('32','64','opizero','nanopineo'):
              asset=pathlib.Path(f'pu2pny-{arch}-5.12.002.img.xz')
              checksum=pathlib.Path(str(asset)+'.sha256')
              info=pathlib.Path(f'BUILD-INFO-{arch}.json')
              assert asset.is_file() and asset.stat().st_size>1000000,(arch,'missing image')
              assert checksum.is_file() and info.is_file(),(arch,'missing integrity data')
              i=json.loads(info.read_text())
              assert i['version']=='5.12.002' and i['architecture']==arch
              assert i['source_commit']==os.environ['GITHUB_SHA']
              assert i['bytes']==asset.stat().st_size
              assert i['validation']['HW']=='NOT_VERIFIED'
              assert i['validation']['protected_rf_nextion']=='PASS'
          print('FOUR_ARCH_GATES_SW_PASS')
          PY
          for arch in 32 64 opizero nanopineo; do
            xz -t "pu2pny-${arch}-5.12.002.img.xz"
            sha256sum -c "pu2pny-${arch}-5.12.002.img.xz.sha256"
          done
      - name: Publicar apenas como prerelease ALPHA (sem substituir P0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          TAG="pu2pny-v5.12.002-p2"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag P1 já publicada, não sobrescrever sem revisão" >&2
            exit 1
          fi
          cat > release-notes.txt <<EOF
          PU2PNY-OS 5.12.002 P2 ALPHA — CANDIDATA PARA TESTE FÍSICO, NÃO É PRODUÇÃO.

          Código fonte: $GITHUB_SHA
          Base: 5.12.000 P0 publicada; SHA-256 verificado para as quatro imagens.

          Escopo limitado:
          - DMR-VOICE-5122: reparar permissões de leitura do INI para o usuário mmdvm, também em rollback e alteração de voz;
          - ARMV6-CPU-5122: adiar tarefas de manutenção/listas no Pi Zero W quando bootando ou sobrecarregado;
          - ARM32-RETRY-5122: limitar reinícios repetidos de restauração do perfil operacional;
          - BOARD-AP-5122: impedir hostapd de distribuição concorrente; ampliar margem de memória do painel;
          - BOARD-HTTP-5122: teste HTTP do backend ARMv7 isolado na imagem de cada placa em modo somente leitura.

          As quatro imagens foram montadas sobre o firmware P1 original de cada placa.
          MMDVMHost, gateways binários, RF apply, NextionDriver ON7LDS, bootloader, rede e presets foram preservados nos gates de manifesto.

          NÃO AFIRMAR: acesso AP/HTTP Orange Pi e NanoPi em hardware; conectividade DMR/YSF/D-Star; Nextion CPU/disk custom HMI; transcoding AMBE; Direct privado/grupo através de CGNAT; alimentação Pi4. Esses itens seguem PENDENTES de testes ou backend funcional.

          Consultar BUILD-INFO e checklist de teste físico em cada imagem. Nenhum resultado de hardware foi inventado.
          EOF
          gh release create "$TAG"             pu2pny-*.img.xz pu2pny-*.img.xz.sha256 BUILD-INFO-*.json             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title 'PU2PNY-OS 5.12.002 P2 ALPHA — DMR/ARMv6/Boards 4 placas'             --notes-file release-notes.txt             --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets
