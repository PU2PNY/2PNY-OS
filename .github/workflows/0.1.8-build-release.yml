name: Build 2PNY 0.1.8 Network Core

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/prepare-0.1.8-anchor-compat.sh'
      - 'ci/prepare-0.1.8-network-core.sh'
      - 'ci/prepare-0.1.8-builder-service-fix.sh'
      - 'ci/validate-0.1.8-image.sh'
      - '.github/workflows/0.1.8-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-018:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.8-alpha
      TAG: v0.1.8-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch source
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh; do
              bash "$f" legacy-source/2pny-os
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate 0.1.8 source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          bash -n rootfs-overlay/usr/local/sbin/2pny-network-core
          bash -n rootfs-overlay/usr/local/sbin/2pny-network-switch
          bash -n rootfs-overlay/usr/local/sbin/2pny-ap-control
          grep -Fq 'raspios_oldstable_lite_arm64' builder/build-image.sh
          grep -Fq 'raspios-bookworm-arm64-lite.img.xz' builder/build-image.sh
          ! grep -Fq 'raspios-trixie-arm64-lite.img.xz' builder/build-image.sh
          grep -q 'hostapd' builder/build-image.sh
          grep -q 'dnsmasq' builder/build-image.sh
          grep -q '2pny-network-core.service' builder/build-image.sh
          ! grep -E 'systemctl.*enable.*(2pny-firstboot|2pny-setup-watch|hostapd|dnsmasq)\.service' builder/build-image.sh
          grep -q '0.1.8-alpha' src/2pnyd/main.go
          grep -q '2PNY_NETWORK_CORE_HANDOFF_V1' src/2pnyd/main.go
          grep -q '^wpa=0$' rootfs-overlay/usr/share/2pny/network/hostapd.template
          grep -q '10.42.0.20,10.42.0.200' rootfs-overlay/usr/share/2pny/network/dnsmasq-ap.template
          grep -q '10.43.0.20,10.43.0.200' rootfs-overlay/usr/share/2pny/network/dnsmasq-eth.template
          grep -q '^DumpTAData=1$' rootfs-overlay/usr/local/sbin/2pny-rf-apply

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate final image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.8-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Publish prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.8 Alpha — Raspberry Pi 4 ARM64.

          First-access network core rebuilt after physical tests:
          - Raspberry Pi OS Legacy / Debian Bookworm base;
          - Wi-Fi AP 2PNY-SETUP is created directly by hostapd, open/no password;
          - AP DHCP/DNS is served explicitly by dnsmasq at 10.42.0.1;
          - direct Ethernet DHCP/DNS is served independently by dnsmasq at 10.43.0.1;
          - Ethernet and Wi-Fi setup run simultaneously;
          - no dependency on NetworkManager ipv4.method=shared for first access;
          - legacy firstboot/setup-watch daemons are masked to prevent races;
          - NetworkManager is released for normal Wi-Fi after setup handoff;
          - captive DNS points clients to the local panel on each setup subnet;
          - final image verifies hostapd, dnsmasq, iw, rfkill, NetworkManager and root-only keyfile permissions;
          - panel is executed from the mounted final image before release;
          - MMDVMHost, RF rollback and DMR Talker Alias remain preserved.

          Wi-Fi: connect to 2PNY-SETUP and open http://10.42.0.1
          Direct cable: open http://10.43.0.1
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.8 Alpha' --notes-file RELEASE-NOTES.md --prerelease
