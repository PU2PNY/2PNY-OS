name: PU2PNY-OS 5.13.001 candidate images
on:
  push:
    branches: [release/pu2pny-5.13]
    paths: ['.github/workflows/5.13-release.yml', 'ci/*5.13*.py', 'runtime/5.13/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pu2pny-5.13.001-images
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        board: ['32', '64', opizero, nanopineo]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Rebuild and test the scoped panel backend
        shell: bash
        run: |
          set -euo pipefail
          export GO111MODULE=off CGO_ENABLED=0
          export GOOS=linux GOARCH=arm GOARM=6
          arch=arm32
          if [[ "$BOARD" == 64 ]]; then
            arch=arm64
            export GOARCH=arm64
            unset GOARM
          fi
          if [[ "$BOARD" == opizero || "$BOARD" == nanopineo ]]; then export GOARM=7; fi
          python3 ci/prepare-5.13-backend.py "$RUNNER_TEMP/backend" "$arch"
          python3 ci/test-5.13.py
          cd "$RUNNER_TEMP/backend"
          env -u GOOS -u GOARCH -u GOARM go test ./...
          go build -trimpath -o "$RUNNER_TEMP/2pnyd" .
      - name: Validate base and generate candidate image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support xz-utils e2fsprogs
          sudo update-binfmts --enable qemu-arm
          mkdir -p "$RUNNER_TEMP/pu2pny"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 25 \
            "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.12.002-p2/pu2pny-${BOARD}-5.12.002.img.xz" \
            -o "$RUNNER_TEMP/pu2pny/pu2pny-${BOARD}-5.12.002.img.xz"
          sudo python3 ci/build-5.13.py "$RUNNER_TEMP/pu2pny" "$BOARD" "$GITHUB_SHA" "$RUNNER_TEMP/2pnyd"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-513-${{ matrix.board }}
          path: ${{ runner.temp }}/pu2pny/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-513-*
          path: artifacts
          merge-multiple: true
      - name: Verify integrity and publish for physical testing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for board in 32 64 opizero nanopineo; do
            image="pu2pny-${board}-5.13.001.img.xz"
            test -s "$image"
            xz -t "$image"
            sha256sum -c "$image.sha256"
            jq -e --arg board "$board" --arg sha "$GITHUB_SHA" \
              '.version=="5.13.001" and .architecture==$board and .source_commit==$sha and .validation.HW=="NOT_VERIFIED"' \
              "BUILD-INFO-$board.json"
          done
          gh release create pu2pny-v5.13.001 \
            ./*.img.xz ./*.img.xz.sha256 ./BUILD-INFO-*.json \
            --target "$GITHUB_SHA" --prerelease --title 'PU2PNY-OS 5.13 para teste físico' \
            --notes-file ../docs/PU2PNY-OS_5.13_HW_CHECKLIST.md
          gh release view pu2pny-v5.13.001 --json tagName,targetCommitish,assets
