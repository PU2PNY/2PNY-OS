name: Build and release PU2PNY-OS 0.3.3 Alpha

on:
  push:
    branches: [ pu2pny-os-0.3.3-alpha ]
    paths:
      - 'src/**'
      - 'ci/**'
      - '.github/workflows/0.3.3-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pu2pny-os-0.3.3-alpha-release
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate 0.3.3 sources
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd-main-0.3.3.go
          go test src/2pnyd-main-0.3.3.go
          python3 -m py_compile \
            src/2pny-live-core-0.3.1.py \
            src/2pny-station-worker-0.3.2.py \
            src/2pny-display-core-0.2.9.py \
            src/2pny-display-apply-0.3.1.py \
            src/2pny-protocol-network-apply-0.3.0.py \
            src/2pny-protocol-network-apply-all-0.3.2.py \
            src/2pny-server-catalog-0.3.1.py \
            src/2pny-aprs-0.3.0.py \
            src/2pny-netdiag-0.3.0.py \
            src/2pny-nextion-autodetect-0.3.1.py \
            ci/prepare-0.3.1-alpha.py \
            ci/prepare-0.3.2-alpha.py \
            ci/prepare-0.3.3-alpha.py
          rm -rf src/__pycache__ ci/__pycache__
          bash -n src/2pny-network-switch-0.3.3 src/2pny-network-core-0.3.3 src/2pny-mdns-guard-0.3.3 src/90-pu2pny-mdns-0.3.3 src/2pny-mode-apply-0.3.0 src/2pny-hostfiles-update-0.3.2 ci/validate-0.3.3-image.sh
          python3 ci/test-0.2.9-live-core.py
          python3 ci/test-0.3.1-live-core.py
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['src/wizard-0.3.3.html','src/dashboard-0.3.3.html','src/internet-0.3.0.html','src/hotspot-0.3.3.html','src/protocols-0.3.1.html','src/history-0.3.0.html','src/aprs-0.3.0.html','src/display-0.3.3.html','src/system-0.3.0.html','src/expert-0.3.0.html']){
            const h=fs.readFileSync(f,'utf8');
            for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
          }
          NODE
          grep -Fq 'atomic(HOST,host_text,0o640,"mmdvm")' src/2pny-protocol-network-apply-all-0.3.2.py
          grep -Fq 'stage_wifi' src/2pny-network-switch-0.3.3
          grep -Fq 'wifi-pending' src/2pny-network-switch-0.3.3
          grep -Fq 'write_connect_state connected' src/2pny-network-core-0.3.3
          grep -Fq 'reconnectCandidates' src/wizard-0.3.3.html
          grep -Fq 'serverCatalog=[]' src/wizard-0.3.3.html
          grep -Fq 'id="activityGroups"' src/dashboard-0.3.3.html
          grep -Fq '2pny-dstargateway.service' src/2pny-station-worker-0.3.2.py
  build-arm64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: 0.3.3-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2 parted
      - name: Restore baseline and apply PU2PNY modules
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh \
            ci/prepare-0.2.0-onboarding.sh \
            ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os
          python3 ci/prepare-0.2.7-radio-live.py legacy-source/2pny-os
          python3 ci/prepare-0.2.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.2.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.0-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.1-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.2-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.3-alpha.py legacy-source/2pny-os
      - name: Validate staged source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          python3 "$GITHUB_WORKSPACE/ci/test-0.2.7-regressions.py"
          python3 "$GITHUB_WORKSPACE/ci/test-0.2.9-live-core.py"
          python3 -m py_compile             rootfs-overlay/usr/local/lib/2pny-live-core.py             rootfs-overlay/usr/local/sbin/2pny-station-worker             rootfs-overlay/usr/local/sbin/2pny-display-core             rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply             rootfs-overlay/usr/local/libexec/2pny-dmr-apply             rootfs-overlay/usr/local/sbin/2pny-aprs             rootfs-overlay/usr/local/sbin/2pny-netdiag             rootfs-overlay/usr/local/sbin/2pny-nextion-autodetect
          bash -n rootfs-overlay/usr/local/sbin/2pny-network-switch rootfs-overlay/usr/local/sbin/2pny-network-core rootfs-overlay/usr/local/sbin/2pny-mdns-guard rootfs-overlay/etc/NetworkManager/dispatcher.d/90-pu2pny-mdns rootfs-overlay/usr/local/sbin/2pny-mode-apply
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.3\.3-alpha"' src/2pnyd/main.go
          grep -Fq '/api/live/events' src/2pnyd/main.go
          grep -Fq '/api/protocol/apply' src/2pnyd/main.go
          grep -Fq '/api/aprs/message' src/2pnyd/main.go
          grep -Fq 'id="liveBox"' rootfs-overlay/usr/share/2pny/dashboard.html
          grep -Fq 'Aguardando transmissão' rootfs-overlay/usr/share/2pny/dashboard.html
          grep -Fq 'location.replace' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq 'id="versionBadge"' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq "['/hotspot','Hotspot','hotspot']" rootfs-overlay/usr/share/2pny/ui-common-0.3.0.js
          test -s rootfs-overlay/usr/share/2pny/hotspot.html
          test -s rootfs-overlay/usr/share/2pny/display.html
          grep -Fq 'Google Time' rootfs-overlay/usr/share/2pny/system.html
      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh
      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-OS-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"
      - name: Validate final image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.3.3-image.sh" "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$VERSION"
      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.3.3-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.3.3-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.3.3-arm64
          path: release
      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          xz -t "$IMAGE"
          test "$(awk '{print $1}' "$IMAGE.sha256")" = "$(sha256sum "$IMAGE" | awk '{print $1}')"
      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY-OS 0.3.3 Alpha — consolidação corretiva após testes físicos da 0.3.2.

          Principais mudanças:
          - Wi-Fi de rádio único agora salva o perfil antes da troca, reinicia de forma controlada, tenta a rede salva no boot e só então ativa AP de recuperação sem apagar as credenciais;
          - pu2pny.local é reaplicado em eventos do NetworkManager para Ethernet e Wi-Fi cliente;
          - menu completo restaurado: Ao Vivo, Internet, Hotspot, Protocolos, APRS / D-PRS, Histórico, Display e Sistema, com PT/EN/ES e acesso Básico/Expert;
          - Hotspot e Display voltaram como páginas próprias;
          - Ao Vivo mantém telemetria detalhada e volta a agrupar um indicativo por linha com botão +;
          - pu2pny.local reforçado com Avahi/mDNS guard;
          - Nextion via MMDVM configurada automaticamente quando o canal de display é utilizável;
          - Ao Vivo dedicado: Aguardando com radar/neon verde, atividade com neon, RadioID/QRZ/bandeira, CPU, RF e rede;
          - atividade agrupada por indicativo com submenu +;
          - Internet dedicada com LAT/PER/JIT e rota até o servidor;
          - Protocolos dedicado: DMR, D-Star REF/DPlus/DCS/XRF/XLX, YSF/C4FM, P25, NXDN e POCSAG/DAPNET;
          - navegação não reconecta; apenas mudanças reais de protocolo/servidor/módulo;
          - Mais usado com estatísticas TX/RX, protocolos e destinos;
          - APRS-IS com beacon, servidor selecionável, mensagens, ACK e notificações, sem DPRS;
          - Sistema: hora local/UTC, fuso, Google Time, voz, anúncio horário, TOT 180 s, operacional, reboot e poweroff;
          - Expert dedicado;
          - Atualizações: verificação de release; instalação automática bloqueada até A/B/rollback completo ser validado.

          Esta é uma versão Alpha para teste físico. Versões anteriores permanecem disponíveis como rollback.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.3-alpha
          target_commitish: ${{ github.sha }}
          name: PU2PNY-OS 0.3.3 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-OS-0.3.3-alpha-arm64.img.xz
            release/PU2PNY-OS-0.3.3-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt