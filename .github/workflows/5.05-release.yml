name: PU2PNY-OS 5.05 ALPHA ARM32 ARM64
on:
  push:
    branches: [release/pu2pny-5.05]
    paths-ignore:
      - 'PU2PNY-OS_MASTER_SPEC.md'
      - 'PU2PNY-OS_CHANGELOG.md'
      - 'PU2PNY-OS_RELEASE_STATUS.md'
      - 'PU2PNY-OS_TEST_MATRIX.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu2pny-5.05-release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Software regression and backend compile
        run: |
          set -euo pipefail
          python3 ci/test-5.03-profile-retry.py
          python3 ci/test-5.03-oled.py
          python3 ci/test-display-045-boot-reapply.py
          python3 ci/test-net-045-wifi-autoconnect.py
          python3 ci/test-5.02.1-overlay.py
          python3 ci/test-expert-054.py 5.04
          python3 ci/test-expert-054.py 5.05
          python3 ci/test-identity-054.py
          python3 ci/test-lcd-054.py
          python3 ci/test-5.04-overlay.py
          python3 ci/test-5.05-display.py
          python3 -m py_compile ci/build-5.05.py ci/patch-image-5.05.py ci/prepare-5.05-backend.py runtime/5.04/identity-apply.py runtime/5.04/lcd.py runtime/5.05/expert-cmd.py runtime/5.05/lcd.py runtime/5.05/oled.py runtime/5.05/i2c.py
          python3 ci/prepare-5.05-backend.py "$RUNNER_TEMP/backend"
          (cd "$RUNNER_TEMP/backend" && GO111MODULE=off go vet . && GO111MODULE=off go test -count=1 -v)
          git diff --check

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Image inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xz-utils e2fsprogs util-linux file >/dev/null
      - name: Cross-build backend and download published immutable 5.04 base
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/work/output"
          python3 ci/prepare-5.05-backend.py "$RUNNER_TEMP/backend"
          if [ "$arch" = arm32 ]; then
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -o "$RUNNER_TEMP/work/2pnyd-arm" .)
            file "$RUNNER_TEMP/work/2pnyd-arm" | grep -E 'ELF 32-bit.*ARM'
            asset=pu2pny-32-5.04.img.xz
          else
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/work/2pnyd-arm64" .)
            file "$RUNNER_TEMP/work/2pnyd-arm64" | grep -Ei 'ELF 64-bit.*aarch64'
            asset=pu2pny-64-5.04.img.xz
          fi
          curl -fL --retry 4 --retry-all-errors "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.04.000/$asset" -o "$RUNNER_TEMP/work/base-$arch.img.xz"
      - name: Full-manifest scope, rollback, filesystem, XZ and SHA
        run: |
          set -euo pipefail
          sudo python3 ci/build-5.05.py "$RUNNER_TEMP/work" '${{ matrix.arch }}' "$GITHUB_SHA"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/work/output"
          cd "$RUNNER_TEMP/work/output"
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-5.05-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz.sha256
            ${{ runner.temp }}/work/output/BUILD-INFO-*.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-5.05-*
          merge-multiple: true
      - name: Final integrity and metadata
        run: |
          set -euo pipefail
          for arch in 32 64; do
            f="pu2pny-$arch-5.05.img.xz"
            test -s "$f"
            xz -t "$f"
            sha256sum -c "$f.sha256"
          done
          python3 - <<'PY'
          import json
          for arch in ('arm32', 'arm64'):
              info = json.load(open('BUILD-INFO-' + arch + '.json'))
              assert info['version'] == '5.05.000'
              assert info['validation']['filesystem'] == 'PASS'
              assert info['validation']['full_scope_manifest'] == 'PASS'
              assert info['validation']['rf_binary_preservation'] == 'PASS'
              assert info['validation']['HW'] == 'NOT_VERIFIED'
          PY
      - name: Publish hardware-test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat >release-notes.txt <<EOF
          PU2PNY-OS 5.05.000 ALPHA / NOT PRODUCTION / NOT HW VERIFIED.
          Source: $GITHUB_SHA. Base: published 5.04.000, SHA-256 verified.
          DISPLAY-055: the system now finds an I2C OLED (0x3C/0x3D) or HD44780 LCD (0x27/0x3F) by a read-only bus scan. Before, a MMDVM present made the system assume a Nextion and the OLED was never started (blank screen).
          Expert page: choose OLED SSD1306 / SH1106 / 128x32 / LCD 16x2 / 20x4 or none (like Pi-Star and WPSD).
          OLED and LCD pages also show MMDVM modem (type, firmware, port, baud, modes, MCU) and Raspberry data (board, load, free RAM, free SD, CPU MHz).
          2pnyd was rebuilt (one new route). MMDVMHost, gateways, NextionDriver, MMDVM-Display, probe, profile autostart, identity page are byte-identical to 5.04.
          NOT FIXED / NO EVIDENCE YET: Pi Zero first boot identification, boot speed, Nextion enhancements. I2C must be enabled in the OS (dtparam=i2c_arm=on); Expert > Telas shows it.
          HW tests needed: real SSD1306, SH1106 and LCD on Pi Zero W and Pi 3/4.
          EOF
          gh release create pu2pny-v5.05.000 pu2pny-*.img.xz pu2pny-*.img.xz.sha256 BUILD-INFO-*.json --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'PU2PNY-OS 5.05 ALPHA (ARM32/ARM64)' --notes-file release-notes.txt --prerelease
          gh release view pu2pny-v5.05.000 --repo "$GH_REPO" --json tagName,targetCommitish,assets
