name: Inspect PU2PNY ARM32 builder

on:
  push:
    branches: [ exp/0.3.6-arm32-poc-20260920 ]
    paths:
      - '.github/workflows/0.3.6-arm32-poc.yml'
      - 'ci/prepare-0.3.6-arm32-poc.py'
      - 'ci/validate-0.3.6-image.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - name: Restore builder and inspect architecture anchors
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          cd legacy-source/2pny-os
          echo '=== builder/build-image.sh architecture anchors ==='
          grep -nE 'arm64|armhf|GOARCH|GOARM|raspios|BASE|bookworm|ARCH|qemu' builder/build-image.sh || true
          echo '=== full builder ==='
          sed -n '1,220p' builder/build-image.sh
          echo '=== builder tree ==='
          find builder -maxdepth 2 -type f -print | sort
          echo '=== relevant architecture references ==='
          grep -RniE 'GOARCH|GOARM|arm64|armhf|raspios.*bookworm' builder src rootfs-overlay 2>/dev/null | head -n 300 || true

  probe-armhf-chroot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Probe Raspberry Pi OS Trixie armhf chroot
        run: |
          set -Eeuo pipefail
          BASE='2026-09-15-raspios-trixie-armhf-lite.img.xz'
          URL='https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2026-09-15/'"$BASE"
          SHA='c766b3fb279b95c12cb4dd22d06f8eab31972c372675d05bd0ca95b060523a7f'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux file
          curl --fail --location --retry 4 --connect-timeout 20 -o "$BASE" "$URL"
          echo "$SHA  $BASE" | sha256sum -c -
          xz -dc "$BASE" > armhf.img
          LOOP="$(sudo losetup --find --partscan --show armhf.img)"
          cleanup(){ set +e; mountpoint -q mnt && sudo umount mnt; sudo losetup -d "$LOOP" 2>/dev/null || true; }
          trap cleanup EXIT
          mkdir -p mnt
          sudo mount "${LOOP}p2" mnt
          echo '=== file architecture ==='
          file mnt/bin/sh mnt/bin/bash
          echo '=== dpkg architecture ==='
          sudo chroot mnt /usr/bin/dpkg --print-architecture
          echo '=== kernel/userland execution ==='
          sudo chroot mnt /bin/uname -m
          sudo chroot mnt /bin/true
          echo 'ARMHF_CHROOT_OK'

  inspect-staged-builder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply full overlay chain and inspect native artifacts
        run: |
          set -Eeuo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh \
            ci/prepare-0.2.0-onboarding.sh \
            ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os
          python3 ci/prepare-0.2.7-radio-live.py legacy-source/2pny-os
          python3 ci/prepare-0.2.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.2.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.0-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.1-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.2-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.3-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.4-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.5-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.6-alpha.py legacy-source/2pny-os
          cd legacy-source/2pny-os
          echo '=== staged builder architecture anchors ==='
          grep -nE 'arm64|armhf|GOARCH|GOARM|raspios|BASE|bookworm|trixie|aarch64' builder/build-image.sh || true
          echo '=== native executable architectures in overlay ==='
          find rootfs-overlay/usr/local -type f -perm /111 -print0 | while IFS= read -r -d '' f; do
            t="$(file -b "$f")"
            case "$t" in *ELF*) printf '%s :: %s\n' "$f" "$t";; esac
          done
      - name: Build isolated ARM32 POC
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2 parted
          python3 ci/prepare-0.3.6-arm32-poc.py legacy-source/2pny-os
          cd legacy-source/2pny-os
          grep -Fq 'ARCH="armhf"' builder/build-image.sh
          grep -Fq 'GOARCH=arm GOARM=6' builder/build-image.sh
          ! grep -Fq 'GOARCH=arm64' builder/build-image.sh
          sudo -E VERSION='0.3.6-alpha' ./builder/build-image.sh
          IMG='dist/2PNY-OS-0.3.6-alpha-armhf.img.xz'
          test -s "$IMG"
          xz -t "$IMG"
          test "$(awk '{print $1}' "$IMG.sha256")" = "$(sha256sum "$IMG" | awk '{print $1}')"
          bash "$GITHUB_WORKSPACE/ci/validate-0.3.6-image.sh" "$IMG" '0.3.6-alpha'
      - name: Verify ARM32 binary architecture
        run: |
          set -Eeuo pipefail
          cd legacy-source/2pny-os
          IMG='dist/2PNY-OS-0.3.6-alpha-armhf.img.xz'
          RAW='/tmp/pu2pny-arm32-poc.img'
          ROOT='/mnt/pu2pny-arm32-poc'
          xz -dc "$IMG" > "$RAW"
          LOOP="$(sudo losetup --find --partscan --show "$RAW")"
          cleanup(){ set +e; mountpoint -q "$ROOT" && sudo umount "$ROOT"; sudo losetup -d "$LOOP" 2>/dev/null || true; rm -f "$RAW"; }
          trap cleanup EXIT
          sudo mkdir -p "$ROOT"
          sudo mount "${LOOP}p2" "$ROOT"
          test "$(sudo chroot "$ROOT" /usr/bin/dpkg --print-architecture)" = 'armhf'
          for b in 2pnyd MMDVM-Host DMRGateway dstargateway YSFGateway P25Gateway NXDNGateway DAPNETGateway; do
            f="$ROOT/usr/local/bin/$b"; test -x "$f"
            file "$f"
            file -b "$f" | grep -Eq 'ELF 32-bit.*ARM'
          done
          echo 'ARM32_ARCHITECTURE_OK'
      - name: Stage ARM32 POC artifact
        run: |
          set -Eeuo pipefail
          mkdir -p arm32-artifact
          cp legacy-source/2pny-os/dist/2PNY-OS-0.3.6-alpha-armhf.img.xz arm32-artifact/PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz
          HASH="$(sha256sum arm32-artifact/PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz' > arm32-artifact/PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.3.6-arm32-experimental
          path: arm32-artifact/*
          compression-level: 0
          retention-days: 7

