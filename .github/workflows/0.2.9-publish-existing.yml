name: Publish validated PU2PNY-OS 0.2.9 and cleanup old binaries

on:
  push:
    branches: [ pu2pny-os-0.2.9-alpha ]
    paths:
      - '.github/workflows/0.2.9-publish-existing.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: 0.2.9-alpha
      SOURCE_RUN_ID: 35441912166
      IMAGE_COMMIT: cd99a520788fd41ebfc9466fadb8457338045e21
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download already validated 0.2.9 artifact
        uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.2.9-arm64
          path: release
          repository: PU2PNY/2PNY-OS
          run-id: 35441912166
          github-token: ${{ github.token }}

      - name: Verify image before publication
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          test -s "$IMAGE"
          test -s "$IMAGE.sha256"
          xz -t "$IMAGE"
          EXPECTED="$(awk '{print $1}' "$IMAGE.sha256")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "SHA256=$ACTUAL" >> "$GITHUB_ENV"
          ls -lh release/

      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<EOF
          PU2PNY-OS 0.2.9 Alpha — imagem ARM64 modular para teste físico.

          Principais mudanças:
          - Wi-Fi de primeiro acesso reforçado com país/região, varredura NetworkManager + iw, múltiplas tentativas, fallback e retorno automático;
          - tela de aviso e contagem durante a troca de rede;
          - Ao Vivo com um único box e correção do TX/RX preso;
          - nome do operador em destaque, RadioID.net com cache SQLite local, QRZ em cache e bandeiras locais;
          - Display Core PU2PNY para Nextion/OLED/LCD;
          - DMR, D-Star, YSF/C4FM, P25 e NXDN em módulos separados;
          - DMR com comandos TG4000/TG4001–4026/TG4099 e voz AMBE;
          - APRS-IS separado;
          - arquitetura modular para futuras correções isoladas.

          SHA256:
          $SHA256
          EOF

      - name: Publish 0.2.9 prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.9-alpha
          target_commitish: cd99a520788fd41ebfc9466fadb8457338045e21
          name: PU2PNY-OS 0.2.9 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/PU2PNY-OS-0.2.9-alpha-arm64.img.xz
            release/PU2PNY-OS-0.2.9-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt

      - name: Verify public release
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.9-alpha" \
            --jq '.assets[].name' | grep -Fxq 'PU2PNY-OS-0.2.9-alpha-arm64.img.xz'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.9-alpha" \
            --jq '.assets[].name' | grep -Fxq 'PU2PNY-OS-0.2.9-alpha-arm64.img.xz.sha256'

      - name: Remove releases and tags 0.2.8 and older
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          api="https://api.github.com"
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"PU2PNY-cleanup-0.2.9",
          }

          def request(path, method="GET"):
              req=urllib.request.Request(api+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as e:
                  if method=="DELETE" and e.code==404:
                      return None
                  raise

          def old_version(text):
              m=re.search(r'(?:^|[-_])v?0\.(\d+)\.(\d+)',text,re.I)
              if not m:
                  m=re.search(r'^v?0\.(\d+)\.(\d+)',text,re.I)
              if not m:
                  return False
              minor,patch=map(int,m.groups())
              return minor<2 or (minor==2 and patch<=8)

          releases=request(f"/repos/{repo}/releases?per_page=100") or []
          deleted=[]
          for rel in releases:
              tag=rel.get("tag_name","")
              if old_version(tag):
                  request(f"/repos/{repo}/releases/{rel['id']}",method="DELETE")
                  try:
                      request(f"/repos/{repo}/git/refs/tags/{tag}",method="DELETE")
                  except Exception:
                      pass
                  deleted.append(tag)
          print("Deleted old releases:",", ".join(deleted) or "none")
          PY

      - name: Remove Actions artifacts belonging to 0.2.8 and older
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          api="https://api.github.com"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28","User-Agent":"PU2PNY-cleanup-0.2.9"}
          def req(path,method="GET"):
              q=urllib.request.Request(api+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(q,timeout=30) as r:
                      b=r.read();return json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  if method=="DELETE" and e.code==404:return None
                  raise
          def old(name):
              m=re.search(r'0\.(\d+)\.(\d+)',name,re.I)
              if not m:return False
              minor,patch=map(int,m.groups())
              return minor<2 or (minor==2 and patch<=8)

          page=1; deleted=0; freed=0
          while True:
              data=req(f"/repos/{repo}/actions/artifacts?per_page=100&page={page}") or {}
              arts=data.get("artifacts",[])
              if not arts:break
              for a in arts:
                  if old(a.get("name","")):
                      req(f"/repos/{repo}/actions/artifacts/{a['id']}",method="DELETE")
                      deleted+=1;freed+=int(a.get("size_in_bytes") or 0)
              page+=1
          print(f"Deleted Actions artifacts: {deleted}; bytes requested for cleanup: {freed}")
          PY

      - name: Final release check
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v0.2.9-alpha/PU2PNY-OS-0.2.9-alpha-arm64.img.xz"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.9-alpha" \
            --jq '{tag:.tag_name,assets:[.assets[].name]}'
          echo "DOWNLOAD_URL=$URL"
