name: Build and release PU2PNY-OS 0.3.31.117

on:
  workflow_dispatch:
  push:
    branches: [pu2pny-os-0.3.31.117-network-nextion]
    paths:
      - .github/workflows/0.3.31.117-build-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: pu2pny-os-0.3.31.117
  cancel-in-progress: false

env:
  VERSION: 0.3.31.117
  BASE_COMMIT: be75b68aa5549c15d538b1814ffd2df5987cb759
  BASE_URL: https://github.com/PU2PNY/2PNY-OS/releases/download/v0.3.31.116/PU2PNY-OS-0.3.31.116-arm64.img.xz
  BASE_SHA256: cac0dd8af71f25370b4142265fa17d04f494980503295b4402155a486b1001df
  NEXTION_UPSTREAM_COMMIT: 03b904270c9cb54f720d71753fc209afb1d9598f
  RELEASE_BRANCH: pu2pny-os-0.3.31.117-network-nextion

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build and image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc curl xz-utils util-linux e2fsprogs file binutils

      - name: Surgical source and baseline gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse $(git rev-parse --verify $BASE_COMMIT))" = "$BASE_COMMIT"
          python3 ci/test-0.3.31.117.py
          python3 -m py_compile ci/harden-nextiondriver-0.3.31.117.py ci/patch-backend-0.3.31.117.py ci/test-0.3.31.117.py ci/sync-canonical-0.3.31.117.py
          bash -n ci/patch-image-0.3.31.117.sh
          python3 ci/test-baseline-guard.py
          python3 ci/test-0.3.30-display.py
          python3 ci/test-0.3.31.114-display-candidate.py
          node --check src/ui-language-0.3.27.js
          node ci/test-i18n-pt-en-es.cjs
          git diff --exit-code "$BASE_COMMIT" HEAD -- \
            'src/*dmr*' 'src/*DMR*' 'src/*dstar*' 'src/*DStar*' 'src/*ysf*' 'src/*YSF*' \
            'src/*mmdvm*' 'src/*MMDVM*' 'src/*protocol-network*' 'src/*network-switch*' \
            'src/*network-online*' 'src/*wizard*'

      - name: Build pinned hardened NextionDriver
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nextiondriver
          git clone https://github.com/on7lds/NextionDriver.git /tmp/nextiondriver
          git -C /tmp/nextiondriver checkout --detach "$NEXTION_UPSTREAM_COMMIT"
          test "$(git -C /tmp/nextiondriver rev-parse HEAD)" = "$NEXTION_UPSTREAM_COMMIT"
          python3 ci/harden-nextiondriver-0.3.31.117.py /tmp/nextiondriver
          if grep -REn '\b(system|popen)[[:space:]]*\(' --include='*.c' /tmp/nextiondriver; then
            echo 'ERROR: shell execution primitive remains in hardened NextionDriver source' >&2
            exit 1
          fi
          make -C /tmp/nextiondriver clean
          make -C /tmp/nextiondriver -j2
          file /tmp/nextiondriver/NextionDriver | grep -Eq 'ARM aarch64|ARM64|aarch64'
          /tmp/nextiondriver/NextionDriver -V | grep -Fq 'NextionDriver version'
          readelf -Ws /tmp/nextiondriver/NextionDriver | grep -Eq '[[:space:]](system|popen)@' && { echo 'ERROR: forbidden libc shell symbol linked' >&2; exit 1; } || true

      - name: Build backend with only version and DISPLAY-025 API policy patch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch-backend-0.3.31.117.py src/2pnyd-main-0.3.27.go /tmp/2pnyd-main.go
          gofmt -w /tmp/2pnyd-main.go
          go test /tmp/2pnyd-main.go
          go build -trimpath -o /tmp/2pnyd-0.3.31.117 /tmp/2pnyd-main.go
          file /tmp/2pnyd-0.3.31.117 | grep -Eq 'ARM aarch64|ARM64|aarch64'
          strings /tmp/2pnyd-0.3.31.117 | grep -Fq '0.3.31.117'
          strings /tmp/2pnyd-0.3.31.117 | grep -Fq 'on7lds-compatible'

      - name: Download and verify immutable 0.3.31.116 baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o base.img.xz "$BASE_URL"
          echo "$BASE_SHA256  base.img.xz" | sha256sum -c -
          xz -t base.img.xz
          xz -dk base.img.xz
          mv base.img "PU2PNY-OS-$VERSION-arm64.img"

      - name: Apply 0.3.31.117 surgical overlay and preflight image
        shell: bash
        run: |
          set -euo pipefail
          IMG="PU2PNY-OS-$VERSION-arm64.img"
          LOOP="$(sudo losetup --find --show --partscan "$IMG")"
          cleanup(){ set +e; mountpoint -q /mnt/pu2pny-root && sudo umount /mnt/pu2pny-root; sudo losetup -d "$LOOP" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          ROOTDEV="$(lsblk -lnpo NAME,FSTYPE "$LOOP" | awk '$2=="ext4"{print $1;exit}')"
          test -n "$ROOTDEV"
          sudo mkdir -p /mnt/pu2pny-root
          sudo mount "$ROOTDEV" /mnt/pu2pny-root
          grep -q '^mmdvm:' /mnt/pu2pny-root/etc/passwd
          grep -q '^mmdvm:' /mnt/pu2pny-root/etc/group

          protected=(
            usr/local/bin/MMDVM-Host
            usr/local/libexec/2pny-dmr-apply
            usr/local/sbin/2pny-protocol-network-apply
            usr/local/sbin/2pny-network-switch
            usr/local/sbin/2pny-network-online
            usr/share/2pny/wizard.html
            etc/systemd/system/2pny-profile-autostart.service
            etc/systemd/system/2pny-profile-proven.path
            etc/systemd/system/2pny-profile-proven.service
          )
          for f in "${protected[@]}"; do sudo sha256sum "/mnt/pu2pny-root/$f"; done | sed 's#/mnt/pu2pny-root/##' > /tmp/protected.before

          sudo bash ci/patch-image-0.3.31.117.sh /mnt/pu2pny-root /tmp/nextiondriver/NextionDriver /tmp/nextiondriver
          sudo install -m 0755 /tmp/2pnyd-0.3.31.117 /mnt/pu2pny-root/usr/local/bin/2pnyd

          test "$(sudo cat /mnt/pu2pny-root/etc/2pny/version)" = "$VERSION"
          sudo strings /mnt/pu2pny-root/usr/local/bin/2pnyd | grep -Fq '0.3.31.117'
          sudo strings /mnt/pu2pny-root/usr/local/bin/2pnyd | grep -Fq 'on7lds-compatible'
          sudo test -x /mnt/pu2pny-root/usr/local/bin/NextionDriver-pu2pny
          sudo grep -Fq 'on7lds-compatible' /mnt/pu2pny-root/usr/share/2pny/display.html
          sudo grep -Fq 'followPrimaryToPanel' /mnt/pu2pny-root/usr/share/2pny/internet.html
          sudo grep -Fq 'Wi-Fi / Uplink · Ethernet' /mnt/pu2pny-root/usr/share/2pny/dashboard.html
          sudo grep -Fq 'mmdvm-transparent-data' /mnt/pu2pny-root/usr/local/sbin/2pny-display-apply
          sudo grep -Fq 'NoNewPrivileges=yes' /mnt/pu2pny-root/etc/systemd/system/2pny-nextiondriver.service
          sudo python3 -m py_compile /mnt/pu2pny-root/usr/local/sbin/2pny-display-apply
          sudo node - <<'NODE'
          const fs=require('fs');
          for(const f of ['/mnt/pu2pny-root/usr/share/2pny/internet.html','/mnt/pu2pny-root/usr/share/2pny/dashboard.html','/mnt/pu2pny-root/usr/share/2pny/display.html']){
            const h=fs.readFileSync(f,'utf8');
            for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
          }
          console.log('PATCHED_HTML_JS_OK');
          NODE

          for f in "${protected[@]}"; do sudo sha256sum "/mnt/pu2pny-root/$f"; done | sed 's#/mnt/pu2pny-root/##' > /tmp/protected.after
          diff -u /tmp/protected.before /tmp/protected.after

          sudo sync
          sudo umount /mnt/pu2pny-root
          sudo e2fsck -fn "$ROOTDEV" || test $? -le 1
          sudo mount -o ro "$ROOTDEV" /mnt/pu2pny-root
          test "$(sudo cat /mnt/pu2pny-root/etc/2pny/version)" = "$VERSION"
          sudo test -x /mnt/pu2pny-root/usr/local/bin/NextionDriver-pu2pny
          sudo grep -Fq 'followPrimaryToPanel' /mnt/pu2pny-root/usr/share/2pny/internet.html
          sudo grep -Fq 'on7lds-compatible' /mnt/pu2pny-root/usr/local/sbin/2pny-display-apply
          for f in "${protected[@]}"; do sudo sha256sum "/mnt/pu2pny-root/$f"; done | sed 's#/mnt/pu2pny-root/##' > /tmp/protected.readonly
          diff -u /tmp/protected.before /tmp/protected.readonly
          sudo umount /mnt/pu2pny-root
          sudo losetup -d "$LOOP"
          trap - EXIT

      - name: Compress verify checksum and build info
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMG="PU2PNY-OS-$VERSION-arm64.img"
          xz -T0 -6 -f "$IMG"
          IMAGE="$IMG.xz"
          xz -t "$IMAGE"
          HASH="$(sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" > "$IMAGE.sha256"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          cat > BUILD-INFO.txt <<EOF
          PU2PNY-OS $VERSION
          classification=physical-test-candidate
          base=v0.3.31.116
          base_commit=$BASE_COMMIT
          base_sha256=$BASE_SHA256
          runtime_commit=$GITHUB_SHA
          nextiondriver_upstream=$NEXTION_UPSTREAM_COMMIT
          scope=NET-037 + LIVE-023 + DISPLAY-025 + version/docs
          protected=RF/MMDVM/DMR/D-Star/YSF/network-switch/network-online/wizard byte-identical by image hash gate
          vps=PASS source gates + overlay fixture + hardened NextionDriver x86_64; Go toolchain unavailable on VPS
          validation=SW/CI + VPS(non-RF subset) + read-only image preflight
          hardware_validation=PENDENTE
          EOF

      - name: Sync canonical docs after successful gates
        shell: bash
        env:
          IMAGE_SHA256: ${{ steps.image.outputs.sha256 }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 ci/sync-canonical-0.3.31.117.py \
            --runtime-commit "$GITHUB_SHA" \
            --image-sha256 "$IMAGE_SHA256" \
            --run-url "$RUN_URL" \
            --vps 'APROVADO (source gates + overlay fixture + NextionDriver x86_64; Go indisponível na VPS)'
          if ! git diff --quiet -- PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_TEST_MATRIX.md PU2PNY-OS_CHANGELOG.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_TEST_MATRIX.md PU2PNY-OS_CHANGELOG.md
            git commit -m 'docs: record 0.3.31.117 SW/CI candidate'
            git push origin HEAD:"$RELEASE_BRANCH"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.3.31.117-arm64
          path: |
            PU2PNY-OS-0.3.31.117-arm64.img.xz
            PU2PNY-OS-0.3.31.117-arm64.img.xz.sha256
            BUILD-INFO.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.3.31.117-arm64
          path: release
      - name: Verify transferred artifact
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          xz -t "$IMAGE"
          test "$(awk '{print $1}' "$IMAGE.sha256")" = "$(sha256sum "$IMAGE" | awk '{print $1}')"
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY-OS 0.3.31.117 — candidata para teste físico.

          Base imutável: v0.3.31.116.

          Correções desta candidata:
          - Wi-Fi: após associação/IPv4 confirmados, a UI procura de forma limitada `pu2pny.local` e os endereços de retomada reais para reabrir o painel na LAN. Ethernet continua usando mDNS; nenhum navegador externo é falsamente tratado como “forçado a abrir”.
          - Ao Vivo: `Wi-Fi / Uplink` usa sinal/RSSI real já coletado pelo backend. Ethernet mostra cabo e RSSI `—`, sem porcentagem inventada.
          - Nextion: novo modo explícito Pi-Star/WPSD/ON7LDS com NextionDriver pinado e endurecido, Transparent Data e single-writer. HMI→shell, download autônomo e flash automático TFT/HMI permanecem bloqueados.

          Protegidos pelo gate de hash: MMDVMHost, DMR/D-Star/YSF, helpers de protocolo, RF, `2pny-network-switch`, `2pny-network-online` e wizard.

          Validação: SW/CI + VPS para subset não-RF. Raspberry Pi/MMDVM/Nextion e RF real continuam PENDENTE HW.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.31.117
          target_commitish: pu2pny-os-0.3.31.117-network-nextion
          name: PU2PNY-OS 0.3.31.117 — candidata para teste físico
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-OS-0.3.31.117-arm64.img.xz
            release/PU2PNY-OS-0.3.31.117-arm64.img.xz.sha256
            release/BUILD-INFO.txt
