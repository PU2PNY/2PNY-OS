name: Build 2PNY hotfix5

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/prepare-0.1.7-hotfix5-bookworm-network.sh'
      - 'ci/prepare-0.1.7-hotfix5-validator-compat.sh'
      - 'ci/validate-0.1.7-hotfix5-image.sh'
      - '.github/workflows/hotfix5-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hotfix5:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.7-hotfix5
      TAG: v0.1.7-hotfix5
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch source
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh; do
              bash "$f" legacy-source/2pny-os
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          bash ./builder/validate-source.sh
          grep -Fq 'raspios_oldstable_lite_arm64' builder/build-image.sh
          grep -Fq 'no-auto-default=*' rootfs-overlay/etc/NetworkManager/conf.d/20-2pny-appliance.conf
          ! grep -q '\[wifi-security\]' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -Fq 'address1=10.42.0.1/24' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -Fq 'address1=10.43.0.1/24' rootfs-overlay/etc/NetworkManager/system-connections/2pny-ethernet-setup.nmconnection

      - name: Build image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.7-hotfix5-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Publish prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.7 hotfix5 — Raspberry Pi ARM64.

          Network recovery release:
          - base pinned to supported Raspberry Pi OS Legacy 64-bit Lite / Debian Bookworm;
          - avoids the newly-released Trixie hotspot regressions seen during physical testing;
          - NetworkManager no-auto-default prevents automatic Wired connection profiles from taking eth0;
          - open Wi-Fi AP 2PNY-SETUP uses no wireless-security section;
          - Wi-Fi setup remains at 10.42.0.1;
          - direct Ethernet remains at 10.43.0.1;
          - both transports are maintained independently;
          - NetworkManager, dnsmasq, rfkill and service enablement are verified inside the final image;
          - stale provisioned state is forbidden in the image;
          - panel is executed inside the mounted final image before release;
          - DMR Talker Alias (DumpTAData=1), MMDVMHost and RF rollback are preserved.

          Wi-Fi: connect to 2PNY-SETUP, then open http://10.42.0.1
          Direct cable: open http://10.43.0.1
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.7 hotfix5' --notes-file RELEASE-NOTES.md --prerelease
