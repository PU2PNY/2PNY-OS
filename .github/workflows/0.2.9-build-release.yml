name: Build and release PU2PNY-OS 0.2.9 Alpha

on:
  push:
    branches: [ pu2pny-os-0.2.9-alpha ]
    paths:
      - 'src/*0.2.9*'
      - 'ci/*0.2.9*'
      - '.github/workflows/0.2.9-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate 0.2.9 modular sources
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd-main-0.2.9.go
          go test src/2pnyd-main-0.2.9.go
          python3 -m py_compile \
            src/2pny-live-core-0.2.9.py \
            src/2pny-station-worker-0.2.9.py \
            src/2pny-display-core-0.2.9.py \
            src/2pny-display-apply-0.2.9.py \
            src/2pny-protocol-network-apply-0.2.9.py \
            src/2pny-protocol-network-apply-all-0.2.9.py \
            src/2pny-server-catalog-0.2.9.py \
            src/2pny-aprs-0.2.9.py \
            ci/patch-dmrgateway-pu2pny-0.2.9.py \
            ci/patch-dmrgateway-hourly-0.2.9.py \
            ci/prepare-0.2.9-alpha.py
          bash -n src/2pny-network-switch-0.2.9 src/2pny-hostfiles-update-0.2.9 ci/validate-0.2.9-image.sh
          python3 ci/test-0.2.9-live-core.py
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['src/wizard-0.2.9.html','src/dashboard-0.2.9.html']){
            const h=fs.readFileSync(f,'utf8');
            for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
          }
          NODE
          grep -Fq 'operators.sqlite' src/2pny-station-worker-0.2.9.py
          grep -Fq 'radioid.net/api/dmr/user/' src/2pny-station-worker-0.2.9.py
          grep -Fq 'for attempt in 1 2 3' src/2pny-network-switch-0.2.9
          grep -Fq 'Nome do operador' src/dashboard-0.2.9.html
          grep -Fq 'País / região do Wi' src/wizard-0.2.9.html

  build-arm64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: 0.2.9-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2 parted
      - name: Restore baseline and apply PU2PNY modules
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh \
            ci/prepare-0.2.0-onboarding.sh \
            ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os
          python3 ci/prepare-0.2.7-radio-live.py legacy-source/2pny-os
          python3 ci/prepare-0.2.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.2.9-alpha.py legacy-source/2pny-os
      - name: Validate staged source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          python3 "$GITHUB_WORKSPACE/ci/test-0.2.7-regressions.py"
          python3 "$GITHUB_WORKSPACE/ci/test-0.2.9-live-core.py"
          python3 -m py_compile \
            rootfs-overlay/usr/local/lib/2pny-live-core.py \
            rootfs-overlay/usr/local/sbin/2pny-station-worker \
            rootfs-overlay/usr/local/sbin/2pny-display-core \
            rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply \
            rootfs-overlay/usr/local/libexec/2pny-dmr-apply \
            rootfs-overlay/usr/local/sbin/2pny-aprs
          bash -n rootfs-overlay/usr/local/sbin/2pny-network-switch
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.2\.9-alpha"' src/2pnyd/main.go
          grep -Fq '/api/live/events' src/2pnyd/main.go
          grep -Fq '/api/network/country' src/2pnyd/main.go
          grep -Fq 'id="liveCard"' rootfs-overlay/usr/share/2pny/dashboard.html
          grep -Fq 'Nome do operador' rootfs-overlay/usr/share/2pny/dashboard.html
          grep -Fq 'reconnectOverlay' rootfs-overlay/usr/share/2pny/wizard.html
      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh
      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-OS-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"
      - name: Validate final image
        working-directory: legacy-source/2pny-os
        run: "$GITHUB_WORKSPACE/ci/validate-0.2.9-image.sh \"dist/PU2PNY-OS-$VERSION-arm64.img.xz\" \"$VERSION\""
      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.2.9-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.2.9-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.2.9-arm64
          path: release
      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          xz -t "$IMAGE"
          test "$(awk '{print $1}' "$IMAGE.sha256")" = "$(sha256sum "$IMAGE" | awk '{print $1}')"
      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY-OS 0.2.9 Alpha — imagem ARM64 modular para teste físico.

          Principais mudanças:
          - Ao Vivo com um único box, nome do operador em destaque e melhor aproveitamento do espaço;
          - atividade enriquecida pelo RadioID.net com cache SQLite local;
          - ID digital não é exibido no box/lista de atividade;
          - pacote local completo de bandeiras SVG para operação offline;
          - fotos QRZ em cache, sem bloquear o Ao Vivo;
          - Wi-Fi de primeiro acesso reforçado: país/região, múltiplas varreduras, fallback iw, três tentativas, rede oculta e restauração automática do AP;
          - tela de aviso/contagem durante a troca de Wi-Fi e retomada automática em Hardware;
          - Display Core PU2PNY separado para Nextion, OLED e LCD;
          - DMR, D-Star, YSF/C4FM, P25 e NXDN em módulos separados;
          - DMR: TG4000 desliga XLX, TG4001–4026 escolhem módulos A–Z e TG4099 informa o estado por voz;
          - voz AMBE PT/EN/ES e anúncio horário opcional;
          - APRS-IS separado, sem DPRS.

          A arquitetura foi dividida por módulos para que correções futuras atinjam apenas o componente com defeito.
          Esta é uma versão Alpha; a 0.2.8 continua disponível como rollback.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.9-alpha
          target_commitish: \${{ github.sha }}
          name: PU2PNY-OS 0.2.9 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-OS-0.2.9-alpha-arm64.img.xz
            release/PU2PNY-OS-0.2.9-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
