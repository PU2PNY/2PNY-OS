name: PU2PNY-OS 4.00.000 Canonical Docs Sync

on:
  push:
    branches: [pu2pny-os-4.00.000-ecosystem]
    paths:
      - '.github/workflows/4.00.000-canonical-docs-sync.yml'
      - 'ci/sync-canonical-4.00.000.sh'
      - 'docs/PU2PNY-OS-4.00.000-ECOSYSTEM-SCOPE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pu2pny-os-4.00.000-ecosystem
          fetch-depth: 0

      - name: Validate sync script
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/sync-canonical-4.00.000.sh

      - name: Sync canonical documents
        shell: bash
        run: |
          set -euo pipefail
          bash ci/sync-canonical-4.00.000.sh

      - name: Commit canonical state when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_TEST_MATRIX.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_CHANGELOG.md; then
            git add PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_TEST_MATRIX.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_CHANGELOG.md
            git commit -m 'docs: register 4.00.000 capability architecture and validation state'
            git push origin HEAD:pu2pny-os-4.00.000-ecosystem
          fi
