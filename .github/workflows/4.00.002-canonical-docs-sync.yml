name: PU2PNY-OS 4.00.002 Canonical Docs Sync

on:
  push:
    branches: [pu2pny-os-4.00.002-display-pistar-helix]
    paths:
      - '.github/workflows/4.00.002-canonical-docs-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pu2pny-os-4.00.002-display-pistar-helix
          fetch-depth: 1
      - name: Append canonical 4.00.002 decisions exactly once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          blocks = {
          "PU2PNY-OS_MASTER_SPEC.md": r'''

          <!-- PU2PNY-OS-4.00.002-CANONICAL -->
          ## PU2PNY-OS 4.00.002 — Display Pi-Star/WPSD + Helix experimental

          - **DISPLAY-033 — Paridade operacional de display Pi-Star/WPSD.** O PU2PNY-OS não mantém renderer/HMI próprio como requisito de funcionamento. A configuração deve usar os contratos reais do MMDVMHost e, quando selecionado, ON7LDS NextionDriver: tipos `None`, `OLED Type 3`, `OLED Type 6`, `Nextion`, `Nextion enhanced`, `Nextion enhanced attached to modem`, `HD44780`, `TFT Serial` e `LCDproc`. Critério SW: INI resultante contém somente chaves suportadas e um único writer físico. Critério HW: tela real mostra standby/RX/TX. Nível mínimo final: HW.
          - **DISPLAY-034 — Controles equivalentes relevantes.** Nextion expõe `G4KLX`, `ON7LDS L2`, `ON7LDS L3`, `ON7LDS L3 HS`, brilho, brilho em espera, relógio/UTC e porta. OLED expõe tipo 3/6, brilho, screensaver, scroll quando aplicável, rotate e invert. Nenhuma função visual não suportada pelo upstream deve ser inventada. Nível: SW + HW.
          - **DISPLAY-035 — Nextion ligado ao modem.** Para `enhanced attached to modem`, usar `Port=modem` com Transparent Data `Enable=1`, `RemotePort=40094`, `LocalPort=40095`, `SendFrameType=1`; nenhum HMI/TFT é gravado automaticamente. ON7LDS NextionDriver deve ser supervisionado sem daemon órfão e somente quando um modo enhanced for escolhido. Nível: SW + HW.
          - **ARCH-011 — Helix testável, opcional e fail-safe.** A 4.00.002 pode expor `off`, `shadow` e `process` para teste explícito. `process` significa somente a ponte PCM local existente; não declarar AMBE/AMBE+2 ou cross-mode legado disponível sem backend externo autorizado/licenciado realmente detectado. Helix permanece `off` por padrão e não pode bloquear boot, RF ou protocolos legados. Nível: SW/VPS; áudio/transcoding final: HW.
          - **PERF-052 — Zero custo de Helix quando off.** Nenhum serviço Helix deve ser habilitado automaticamente na imagem; ativação ocorre somente por ação explícita. Nível: SW/VPS.
          - **REL-052 — Gate 4.00.002.** Gerar ARM32/ARMv6 e ARM64 sobre artefatos imutáveis 4.00.001, validar XZ, filesystem, arquitetura, versão, SHA-256 e hashes da baseline protegida. Classificação máxima antes do reteste físico: CANDIDATA PARA TESTE FÍSICO.
          ''',
          "PU2PNY-OS_CHANGELOG.md": r'''

          <!-- PU2PNY-OS-4.00.002-CANONICAL -->
          ## 4.00.002 — Display Pi-Star/WPSD + Helix experimental
          - Substitui o caminho ativo de configuração de display próprio pelo contrato MMDVMHost/ON7LDS usado por Pi-Star/WPSD.
          - Registra `DISPLAY-033..035`, `ARCH-011`, `PERF-052` e `REL-052`.
          - Corrige a supervisão do ON7LDS NextionDriver com base no comportamento real do upstream: `-d` mantém o processo em foreground; a 4.00.001 havia removido esse sinalizador por interpretação incorreta e não é baseline aprovada de display.
          - Nenhum `.hmi/.tft` é auto-gravado. O layout selecionado deve corresponder ao que já está na tela.
          - Helix ganha controle explícito off/shadow/process para teste; cross-mode legado continua indisponível sem backend codec externo real/autorizado.
          - RF/DMR/D-Star/YSF/rede/wizard/Ao Vivo e demais áreas confirmadas funcionando permanecem baseline protegida.
          ''',
          "PU2PNY-OS_RELEASE_STATUS.md": r'''

          <!-- PU2PNY-OS-4.00.002-CANONICAL -->
          ## 4.00.002 — EM TESTE / candidata somente após gates
          - Base imutável: `v4.00.001`; rollback: `backup/4.00.001-pre-4.00.002-display-helix-20261015`.
          - Branch: `pu2pny-os-4.00.002-display-pistar-helix`.
          - Display/Nextion 4.00.001 permanece **HW FALHOU** conforme relato do usuário e não é carregado como baseline funcional.
          - Objetivo: paridade de configuração Pi-Star/WPSD, sem HMI próprio obrigatório ou auto-flash.
          - Helix: ativação experimental controlada; `off` por padrão; HVC/AMBE/cross-mode legado não promovidos a produção.
          - Classificação máxima antes de teste físico: **CANDIDATA PARA TESTE FÍSICO**. Nextion/OLED, RF real e áudio/transcoding permanecem HW PENDENTE.
          ''',
          "PU2PNY-OS_TEST_MATRIX.md": r'''

          <!-- PU2PNY-OS-4.00.002-CANONICAL -->
          ## Matriz 4.00.002

          | ID | Caso | Resultado esperado | Estado inicial | Nível |
          |---|---|---|---|---|
          | SW-400002-DISPLAY / DISPLAY-033 | gerar configs por tipo | MMDVMHost/NextionDriver recebem somente semântica upstream; sem renderer próprio | EM TESTE | SW |
          | SW-400002-NEXTION-MODEM / DISPLAY-035 | enhanced + modem | Port=modem + Transparent Data 40094/40095 + SendFrameType=1 | EM TESTE | SW |
          | SW-400002-NEXTION-SERVICE / DISPLAY-035 | supervisão driver | `-d` foreground sob systemd; enhanced habilita serviço, demais modos não | EM TESTE | SW |
          | SW-400002-OLED / DISPLAY-034 | OLED 3/6 | rotate/invert/screensaver e scroll apenas quando aplicável | EM TESTE | SW |
          | VPS-400002-HELIX / ARCH-011 | off/shadow/process | self-test, serviço local e rollback; off sem carga | PENDENTE | VPS |
          | SW-400002-BASELINE | manifesto 4.00.001 antes/depois | RF/protocolos/gateways/rede/wizard/Ao Vivo protegidos byte-idênticos | EM TESTE | SW/CI |
          | REL-400002-ARM32 / REL-052 | imagem ARMv6 | XZ/fsck/mount/version/SHA PASS | PENDENTE | SW/CI |
          | REL-400002-ARM64 / REL-052 | imagem ARM64 | XZ/fsck/mount/version/SHA PASS | PENDENTE | SW/CI |
          | HW-400002-DISPLAY | Nextion/OLED real | imagem/standby/RX/TX e controles respondem sem regressão MMDVMHost | PENDENTE | HW |
          | HW-400002-HELIX-AUDIO | áudio/process real | somente capacidade realmente conectada a backend/protocolo pode ser promovida | PENDENTE | HW |
          ''',
          }

          for name, block in blocks.items():
              p = Path(name)
              text = p.read_text()
              marker = "<!-- PU2PNY-OS-4.00.002-CANONICAL -->"
              if marker not in text:
                  p.write_text(text.rstrip() + block + "\n")
          PY
          git diff --check
          if git diff --quiet; then
            echo DOCS_ALREADY_SYNCED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_CHANGELOG.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_TEST_MATRIX.md
          git commit -m 'docs: register 4.00.002 display and Helix gates'
          git push origin HEAD:pu2pny-os-4.00.002-display-pistar-helix
