name: Build 2PNY hotfix2 v2

# Single authoritative hotfix2 builder/publisher. Keep only this workflow for v0.1.7-hotfix2.
on:
  push:
    branches: [ hotfix2-captive-responsive, main ]
    paths:
      - 'ci/prepare-0.1.7-hotfix2-listener-prep.sh'
      - 'ci/prepare-0.1.7-hotfix2-captive-responsive.sh'
      - 'ci/prepare-0.1.7-hotfix2-route-dedupe.sh'
      - 'ci/validate-0.1.7-hotfix2-image.sh'
      - '.github/workflows/hotfix2-build-release-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hotfix2:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.7-hotfix2
      TAG: v0.1.7-hotfix2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch source
        run: |
          set -euo pipefail
          test ! -e .github/workflows/hotfix2-build-release.yml
          bash legacy-source/2pny-os/bootstrap.sh
          for f in ci/prepare-0.1.2.sh ci/prepare-0.1.3.sh ci/prepare-0.1.4-ui.sh ci/prepare-0.1.5-hardware.sh ci/prepare-0.1.5-fixes.sh ci/prepare-0.1.6-rf.sh ci/prepare-0.1.6-build-fix.sh ci/prepare-0.1.7-modules.sh ci/prepare-0.1.7-hotfix1-ethernet.sh ci/prepare-0.1.7-hotfix2-listener-prep.sh ci/prepare-0.1.7-hotfix2-captive-responsive.sh ci/prepare-0.1.7-hotfix2-route-dedupe.sh; do
            bash "$f" legacy-source/2pny-os
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          bash -x ./builder/validate-source.sh
          grep -q 'listenAddr.*0.0.0.0:80' src/2pnyd/main.go
          test "$(grep -Fc 'http.HandleFunc("/api/hardware"' src/2pnyd/main.go)" -eq 1
          bash -n rootfs-overlay/usr/local/sbin/2pny-ap-control
          python3 -m py_compile rootfs-overlay/usr/local/sbin/2pny-hardware-probe

      - name: Build image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.7-hotfix2-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Publish prerelease
        if: github.ref == 'refs/heads/main'
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.7 hotfix2 — Raspberry Pi ARM64.

          - Wi-Fi 2PNY-SETUP aberto, sem senha;
          - captive portal para Windows/Android/iOS (abertura automática quando o cliente permitir);
          - painel explicitamente ouvindo em 0.0.0.0:80 e executado no CI antes da publicação;
          - botão para ativar/desativar o AP;
          - layout responsivo para celular, tablet e desktop;
          - detecção de display ampliada com identificação somente quando confirmável;
          - Ethernet direto, MMDVMHost e rollback RF preservados.

          Configuração: http://10.42.0.1
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '2PNY OS 0.1.7 hotfix2' --notes-file RELEASE-NOTES.md --prerelease
