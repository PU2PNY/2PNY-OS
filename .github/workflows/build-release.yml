name: Build and Release 2PNY OS Alpha

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/prepare-0.1.2.sh'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.2-alpha
      TAG: v0.1.2-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 2PNY repository
        uses: actions/checkout@v4

      - name: Fetch temporary Alpha source base
        uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch 2PNY source
        run: |
          bash legacy-source/2pny-os/bootstrap.sh
          bash ci/prepare-0.1.2.sh legacy-source/2pny-os

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils util-linux rsync dosfstools e2fsprogs file

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: ./builder/validate-source.sh

      - name: Build Raspberry Pi image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate compressed image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          xz -t "$IMAGE"
          EXPECTED=$(awk '{print $1}' "${IMAGE}.sha256")
          ACTUAL=$(sha256sum "$IMAGE" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          echo "SHA-256 OK: $ACTUAL"

      - name: Validate Pi 4 boot and filesystems
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          RAW="${IMAGE%.xz}"
          xz -dk "$IMAGE"
          sudo sfdisk -d "$RAW"
          LOOP=$(sudo losetup --find --partscan --show "$RAW")
          cleanup() {
            set +e
            sudo umount /mnt/2pny-root/boot/firmware 2>/dev/null || true
            sudo umount /mnt/2pny-root 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..20}; do test -b "${LOOP}p2" && break; sleep .25; done
          sudo fsck.vfat -n "${LOOP}p1"
          sudo e2fsck -fn "${LOOP}p2"
          sudo mkdir -p /mnt/2pny-root
          sudo mount -o ro "${LOOP}p2" /mnt/2pny-root
          sudo mkdir -p /mnt/2pny-root/boot/firmware
          sudo mount -o ro "${LOOP}p1" /mnt/2pny-root/boot/firmware
          test -s /mnt/2pny-root/boot/firmware/kernel8.img
          test -s /mnt/2pny-root/boot/firmware/start4.elf
          test -s /mnt/2pny-root/boot/firmware/bcm2711-rpi-4-b.dtb
          grep -q 'arm_64bit=1' /mnt/2pny-root/boot/firmware/config.txt
          grep -q 'root=PARTUUID=' /mnt/2pny-root/boot/firmware/cmdline.txt
          test -x /mnt/2pny-root/usr/local/bin/2pnyd
          test -x /mnt/2pny-root/usr/local/sbin/2pny-firstboot
          test -f /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-ethernet.nmconnection
          test -f /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          test "$(sudo stat -c '%a' /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-setup.nmconnection)" = "600"
          echo 'Pi 4 boot files, FAT, EXT4 and 2PNY first access: OK'
          cleanup
          trap - EXIT
          rm -f "$RAW"

      - name: Publish complete GitHub prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.2 Alpha — Raspberry Pi ARM64.

          Corrige a preparação do Wi-Fi e Ethernet do primeiro acesso. A publicação só ocorre após SHA-256, teste XZ, fsck FAT/EXT4 e checagem dos arquivos de boot da Raspberry Pi 4.

          Primeiro acesso: SSID 2PNY-SETUP, senha 2pnysetup, http://2pny.local, fallback http://10.42.0.1.

          Alpha de boot/rede/painel. A camada RF MMDVM ainda não é operacional nesta versão.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.2 Alpha' \
            --notes-file RELEASE-NOTES.md \
            --prerelease
