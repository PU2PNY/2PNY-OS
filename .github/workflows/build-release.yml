name: Build and Release 2PNY OS Alpha

on:
  push:
    branches: [ main, ui-modular-0.1.4 ]
    paths:
      - 'ci/**'
      - 'docs/MODULES.md'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.4-alpha
      TAG: v0.1.4-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 2PNY repository
        uses: actions/checkout@v4

      - name: Fetch temporary Alpha source base
        uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore modular 2PNY source
        run: |
          bash legacy-source/2pny-os/bootstrap.sh
          bash ci/prepare-0.1.2.sh legacy-source/2pny-os
          bash ci/prepare-0.1.3.sh legacy-source/2pny-os
          bash ci/prepare-0.1.4-ui.sh legacy-source/2pny-os

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils util-linux rsync dosfstools e2fsprogs file

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: ./builder/validate-source.sh

      - name: Build Raspberry Pi image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate compressed image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          xz -t "$IMAGE"
          EXPECTED=$(awk '{print $1}' "${IMAGE}.sha256")
          ACTUAL=$(sha256sum "$IMAGE" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          echo "SHA-256 OK: $ACTUAL"

      - name: Validate Pi 4, first access and UI
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          RAW="${IMAGE%.xz}"
          sudo xz -dk "$IMAGE"
          sudo sfdisk -d "$RAW"
          LOOP=$(sudo losetup --find --partscan --show "$RAW")
          cleanup() {
            set +e
            sudo umount /mnt/2pny-root/boot/firmware 2>/dev/null || true
            sudo umount /mnt/2pny-root 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..20}; do test -b "${LOOP}p2" && break; sleep .25; done
          sudo fsck.vfat -n "${LOOP}p1"
          sudo e2fsck -fn "${LOOP}p2"
          sudo mkdir -p /mnt/2pny-root
          sudo mount -o ro "${LOOP}p2" /mnt/2pny-root
          sudo mkdir -p /mnt/2pny-root/boot/firmware
          sudo mount -o ro "${LOOP}p1" /mnt/2pny-root/boot/firmware

          test -s /mnt/2pny-root/boot/firmware/kernel8.img
          test -s /mnt/2pny-root/boot/firmware/start4.elf
          test -s /mnt/2pny-root/boot/firmware/bcm2711-rpi-4-b.dtb
          grep -q 'arm_64bit=1' /mnt/2pny-root/boot/firmware/config.txt
          grep -qw 'network-config=disabled' /mnt/2pny-root/boot/firmware/cmdline.txt
          grep -qw 'cfg80211.ieee80211_regdom=BR' /mnt/2pny-root/boot/firmware/cmdline.txt

          test -x /mnt/2pny-root/usr/local/bin/2pnyd
          test -x /mnt/2pny-root/usr/local/sbin/2pny-firstboot
          grep -q 'Restart=on-failure' /mnt/2pny-root/etc/systemd/system/2pny-firstboot.service
          grep -q '169.254.2.1/16' /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-ethernet.nmconnection
          grep -q 'address1=10.42.0.1/24' /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -q '0.1.4-alpha' /mnt/2pny-root/etc/2pny/version
          strings /mnt/2pny-root/usr/local/bin/2pnyd | grep -q 'pny-theme-toggle'
          strings /mnt/2pny-root/usr/local/bin/2pnyd | grep -q 'Abrindo o painel automaticamente'

          echo 'Pi 4, network handoff, dark-first UI and automatic setup transition: OK'
          cleanup
          trap - EXIT
          sudo rm -f "$RAW"

      - name: Publish complete GitHub prerelease
        if: github.ref == 'refs/heads/main'
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.4 Alpha — Raspberry Pi ARM64.

          Evolução modular da interface e do primeiro acesso:
          - tema escuro como padrão;
          - alternância claro/escuro persistente no navegador;
          - contraste, foco e responsividade melhorados;
          - estado de conexão do primeiro acesso em tempo real;
          - avanço automático após o Wi-Fi conectar;
          - Ethernet com DHCP e fallback direto 169.254.2.1;
          - base organizada em módulos para Hardware/MMDVM, RF, protocolos, Display/Nextion, diagnóstico e updates.

          Esta Alpha ainda valida Core, Provisioning, Network e UI. A camada RF/MMDVM operacional entra na próxima etapa.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.4 Alpha' \
            --notes-file RELEASE-NOTES.md \
            --prerelease
