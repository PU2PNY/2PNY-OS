name: Build and Release 2PNY OS Alpha

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.2-alpha
      TAG: v0.1.2-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 2PNY repository
        uses: actions/checkout@v4

      - name: Fetch temporary Alpha source base
        uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch 2PNY 0.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          cd legacy-source/2pny-os
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          p=root/'builder/build-image.sh'
          s=p.read_text()
          s=s.replace('VERSION="${VERSION:-0.1.1-alpha}"','VERSION="${VERSION:-0.1.2-alpha}"')
          s=s.replace('network-manager avahi-daemon dnsmasq-base ca-certificates curl iproute2 iw i2c-tools usbutils python3',
          'network-manager avahi-daemon dnsmasq-base ca-certificates curl iproute2 iw i2c-tools usbutils python3 \\\n            wpasupplicant rfkill wireless-regdb')
          s=s.replace('chmod 0755 "${ROOT_MNT}/etc/NetworkManager/dispatcher.d/90-2pny-connectivity"\n',
          'chmod 0755 "${ROOT_MNT}/etc/NetworkManager/dispatcher.d/90-2pny-connectivity"\nchmod 0600 "${ROOT_MNT}/etc/NetworkManager/system-connections/"*.nmconnection\n')
          p.write_text(s)

          p=root/'src/2pnyd/main.go'
          s=p.read_text().replace('appVersion      = "0.1.1-alpha"','appVersion      = "0.1.2-alpha"').replace('<b>Alpha 0.1.1:</b>','<b>Alpha 0.1.2:</b>')
          p.write_text(s)
          (root/'rootfs-overlay/etc/2pny/version').write_text('0.1.2-alpha\n')

          p=root/'rootfs-overlay/usr/local/sbin/2pny-firstboot'
          p.write_text(r'''#!/bin/bash
set -euo pipefail
STATE=/var/lib/2pny
LOG=/var/log/2pny-firstboot.log
mkdir -p "$STATE"
exec >>"$LOG" 2>&1
echo "[$(date -Is)] 2PNY first boot 0.1.2-alpha"
hostnamectl set-hostname 2pny || true
systemctl enable --now NetworkManager.service || true
systemctl enable --now avahi-daemon.service || true
rfkill unblock wifi 2>/dev/null || true
nmcli radio wifi on 2>/dev/null || true
if [[ -f "$STATE/provisioned" ]]; then exit 0; fi
for _ in {1..30}; do nmcli -t -f DEVICE,TYPE device status >/dev/null 2>&1 && break; sleep 1; done
ETH_IF="$(nmcli -t -f DEVICE,TYPE device status 2>/dev/null | awk -F: '$2=="ethernet"{print $1;exit}')"
if [[ -n "${ETH_IF:-}" ]]; then
  nmcli connection modify "2PNY-Ethernet" connection.autoconnect yes connection.autoconnect-priority 50 2>/dev/null || true
  nmcli connection up "2PNY-Ethernet" >/dev/null 2>&1 || true
  echo "Ethernet prepared on ${ETH_IF}"
fi
WIFI_IF="$(nmcli -t -f DEVICE,TYPE device status 2>/dev/null | awk -F: '$2=="wifi"{print $1;exit}')"
if [[ -n "${WIFI_IF:-}" ]]; then
  ip link set "$WIFI_IF" up 2>/dev/null || true
  nmcli radio wifi on 2>/dev/null || true
  nmcli connection up "2PNY-SETUP" >/dev/null 2>&1 || true
  echo "Setup hotspot requested on ${WIFI_IF}: SSID=2PNY-SETUP IP=10.42.0.1"
else
  echo "No Wi-Fi interface detected. Ethernet DHCP/mDNS remains available."
fi
systemctl restart avahi-daemon.service || true
systemctl restart 2pnyd.service || true
ip -4 address show || true
nmcli device status || true
echo "[$(date -Is)] first boot ready"
''')

          conn=root/'rootfs-overlay/etc/NetworkManager/system-connections'
          conn.mkdir(parents=True,exist_ok=True)
          (conn/'2pny-ethernet.nmconnection').write_text('''[connection]
id=2PNY-Ethernet
uuid=7ec42a49-a77d-49f7-a181-2a4f00000001
type=ethernet
autoconnect=true
autoconnect-priority=50

[ethernet]

[ipv4]
method=auto

[ipv6]
method=auto
addr-gen-mode=default

[proxy]
''')
          (conn/'2pny-setup.nmconnection').write_text('''[connection]
id=2PNY-SETUP
uuid=5d9da2d9-3b48-4936-8201-2a4f00000002
type=wifi
interface-name=wlan0
autoconnect=true
autoconnect-priority=100

[wifi]
mode=ap
band=bg
channel=6
ssid=2PNY-SETUP

[wifi-security]
key-mgmt=wpa-psk
psk=2pnysetup

[ipv4]
method=shared
address1=10.42.0.1/24

[ipv6]
method=disabled

[proxy]
''')

          p=root/'rootfs-overlay/etc/systemd/system/2pnyd.service'
          s=p.read_text().replace('After=network.target\nWants=network.target','After=NetworkManager.service network-online.target\nWants=NetworkManager.service network-online.target')
          p.write_text(s)
          p=root/'builder/validate-source.sh'
          s=p.read_text().replace('rootfs-overlay/etc/systemd/system/2pny-firstboot.service; do',
          'rootfs-overlay/etc/systemd/system/2pny-firstboot.service \\\n            rootfs-overlay/etc/NetworkManager/system-connections/2pny-ethernet.nmconnection \\\n            rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection; do')
          p.write_text(s)
          PY
          chmod +x builder/build-image.sh builder/validate-source.sh rootfs-overlay/usr/local/sbin/2pny-firstboot

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: ./builder/validate-source.sh

      - name: Build Raspberry Pi image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate compressed image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          xz -t "$IMAGE"
          EXPECTED=$(awk '{print $1}' "${IMAGE}.sha256")
          ACTUAL=$(sha256sum "$IMAGE" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          echo "SHA-256 OK: $ACTUAL"

      - name: Validate Pi 4 boot and filesystems
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          RAW="${IMAGE%.xz}"
          xz -dk "$IMAGE"
          sudo sfdisk -d "$RAW"
          LOOP=$(sudo losetup --find --partscan --show "$RAW")
          cleanup() {
            set +e
            sudo umount /mnt/2pny-root/boot/firmware 2>/dev/null || true
            sudo umount /mnt/2pny-root 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..20}; do test -b "${LOOP}p2" && break; sleep .25; done
          sudo fsck.vfat -n "${LOOP}p1"
          sudo e2fsck -fn "${LOOP}p2"
          sudo mkdir -p /mnt/2pny-root
          sudo mount -o ro "${LOOP}p2" /mnt/2pny-root
          sudo mkdir -p /mnt/2pny-root/boot/firmware
          sudo mount -o ro "${LOOP}p1" /mnt/2pny-root/boot/firmware
          test -s /mnt/2pny-root/boot/firmware/kernel8.img
          test -s /mnt/2pny-root/boot/firmware/start4.elf
          test -s /mnt/2pny-root/boot/firmware/bcm2711-rpi-4-b.dtb
          grep -q 'arm_64bit=1' /mnt/2pny-root/boot/firmware/config.txt
          grep -q 'root=PARTUUID=' /mnt/2pny-root/boot/firmware/cmdline.txt
          test -x /mnt/2pny-root/usr/local/bin/2pnyd
          test -x /mnt/2pny-root/usr/local/sbin/2pny-firstboot
          test -f /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-ethernet.nmconnection
          test -f /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          test "$(sudo stat -c '%a' /mnt/2pny-root/etc/NetworkManager/system-connections/2pny-setup.nmconnection)" = "600"
          echo 'Pi 4 boot files, FAT, EXT4 and 2PNY first access: OK'
          cleanup
          trap - EXIT
          rm -f "$RAW"

      - name: Publish complete GitHub prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.2 Alpha — Raspberry Pi ARM64.

          Correções: backend Wi-Fi instalado explicitamente, rfkill/wireless-regdb, perfil Ethernet DHCP pré-criado, perfil 2PNY-SETUP pré-criado e first boot reforçado.

          A publicação só ocorre após SHA-256, xz -t, fsck FAT/EXT4 e checagem dos arquivos de boot da Raspberry Pi 4.

          Primeiro acesso: Wi-Fi 2PNY-SETUP / senha 2pnysetup / http://2pny.local / fallback http://10.42.0.1.

          Alpha de boot/rede/painel. A camada RF MMDVM ainda não é operacional nesta versão.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.2 Alpha' \
            --notes-file RELEASE-NOTES.md \
            --prerelease
