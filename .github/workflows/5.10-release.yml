name: PU2PNY-OS 5.10 ALPHA ARM32 ARM64
on:
  push:
    branches: [release/pu2pny-5.10]
    paths-ignore:
      - 'PU2PNY-OS_MASTER_SPEC.md'
      - 'PU2PNY-OS_CHANGELOG.md'
      - 'PU2PNY-OS_RELEASE_STATUS.md'
      - 'PU2PNY-OS_TEST_MATRIX.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu2pny-5.10-release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Software regression and backend compile
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python3 -m pip install --quiet pillow
          python3 -c 'import PIL'
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf
          python3 ci/test-5.03-profile-retry.py
          python3 ci/test-5.03-oled.py
          python3 ci/test-display-045-boot-reapply.py
          python3 ci/test-net-045-wifi-autoconnect.py
          python3 ci/test-5.02.1-overlay.py
          python3 ci/test-expert-054.py 5.04
          python3 ci/test-expert-054.py 5.05
          python3 ci/test-expert-054.py 5.06
          python3 ci/test-identity-054.py
          python3 ci/test-lcd-054.py
          python3 ci/test-5.04-overlay.py
          python3 ci/test-5.05-display.py
          python3 ci/test-5.06.py
          python3 ci/test-5.07.py
          python3 ci/test-5.08.py
          python3 ci/test-5.09.py
          python3 ci/test-5.10.py
          sudo apt-get install -y --no-install-recommends qemu-user-static
          (cd src/direct-core && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -trimpath -o "$RUNNER_TEMP/core-arm" direct_types.go direct_session.go direct_transport.go direct_radio.go direct_main.go)
          qemu-arm-static "$RUNNER_TEMP/core-arm" --selftest | grep DIRECT_SELFTEST_OK
          python3 ci/test-expert-054.py 5.10
          python3 ci/test-expert-054.py 5.07
          python3 ci/test-expert-054.py 5.08
          python3 -m py_compile ci/build-5.10.py ci/patch-image-5.10.py ci/prepare-5.10-backend.py
          python3 ci/prepare-5.10-backend.py "$RUNNER_TEMP/backend"
          (cd "$RUNNER_TEMP/backend" && GO111MODULE=off go vet . && GO111MODULE=off go test -count=1 -v)
          python3 ci/prepare-5.10-backend.py "$RUNNER_TEMP/backend32" arm32
          (cd "$RUNNER_TEMP/backend32" && GO111MODULE=off go vet .)
          git diff --check

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Image inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xz-utils e2fsprogs util-linux file >/dev/null
      - name: Cross-build backend and download published immutable 5.09 base
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/work/output"
          if [ "$arch" = arm32 ]; then
            python3 ci/prepare-5.10-backend.py "$RUNNER_TEMP/backend" arm32
          else
            python3 ci/prepare-5.10-backend.py "$RUNNER_TEMP/backend"
          fi
          if [ "$arch" = arm32 ]; then
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -o "$RUNNER_TEMP/work/2pnyd-arm" .)
            file "$RUNNER_TEMP/work/2pnyd-arm" | grep -E 'ELF 32-bit.*ARM'
            (cd src/direct-core && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -trimpath -o "$RUNNER_TEMP/work/direct-core-arm" direct_types.go direct_session.go direct_transport.go direct_radio.go direct_main.go)
            file "$RUNNER_TEMP/work/direct-core-arm" | grep -E 'ELF 32-bit.*ARM'
            asset=pu2pny-32-5.09.img.xz
          else
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/work/2pnyd-arm64" .)
            file "$RUNNER_TEMP/work/2pnyd-arm64" | grep -Ei 'ELF 64-bit.*aarch64'
            asset=pu2pny-64-5.09.img.xz
          fi
          curl -fL --retry 4 --retry-all-errors "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.09.000/$asset" -o "$RUNNER_TEMP/work/base-$arch.img.xz"
      - name: Full-manifest scope, rollback, filesystem, XZ and SHA
        run: |
          set -euo pipefail
          sudo python3 ci/build-5.10.py "$RUNNER_TEMP/work" '${{ matrix.arch }}' "$GITHUB_SHA"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/work/output"
          cd "$RUNNER_TEMP/work/output"
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-5.10-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz.sha256
            ${{ runner.temp }}/work/output/BUILD-INFO-*.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-5.10-*
          merge-multiple: true
      - name: Final integrity and metadata
        run: |
          set -euo pipefail
          for arch in 32 64; do
            f="pu2pny-$arch-5.10.img.xz"
            test -s "$f"
            xz -t "$f"
            sha256sum -c "$f.sha256"
          done
          python3 - <<'PY'
          import json
          for arch in ('arm32', 'arm64'):
              info = json.load(open('BUILD-INFO-' + arch + '.json'))
              assert info['version'] == '5.10.000'
              assert info['validation']['filesystem'] == 'PASS'
              assert info['validation']['full_scope_manifest'] == 'PASS'
              assert info['validation']['rf_binary_preservation'] == 'PASS'
              assert info['validation']['HW'] == 'NOT_VERIFIED'
          PY
      - name: Publish hardware-test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat >release-notes.txt <<EOF
          PU2PNY-OS 5.10.000 ALPHA / NOT PRODUCTION / NOT HW VERIFIED.
          Source: $GITHUB_SHA. Base: published 5.09.000, SHA-256 verified.
          CLOCK-060: the time zone could never change: 2pny-timezone-apply.service ran with ProtectSystem=full and only /etc/timezone writable, so the helper could not replace the /etc/localtime link (it stayed Europe/London). /etc is now writable for that one-shot unit only.
          DIRECT-060: the 32-bit image shipped an AArch64 2pny-direct-core that a Pi Zero cannot execute, so the service restarted every 8 s forever (load 5.3, CPU 86%, slow Ao Vivo). It is now an ARMv6 build of the project source (self-tested under qemu in CI) and the unit stops after 4 failures in 15 minutes.
          BOOT-060: auto-maintenance and the host-list refresh wait 5 minutes after boot.
          UI-060: header logo is the PU2PNY-OS wordmark without the small tagline, larger; Protocolos has an Edit callsign and ID button at the top.
          EXPERT-060: NetworkManager keyfile owners and the clock request/result files in the Expert page.
          Unchanged: RF, MMDVMHost, DMRGateway, NextionDriver, probe, autostart and apply scripts.
          NOT FIXED yet: two browser tabs at AP join, Nextion CPU/IP fields, slow activation, YSF link, crossmode, Direct groups, Orange Pi/NanoPi (planned for 5.11).

          EOF
          gh release create pu2pny-v5.10.000 pu2pny-*.img.xz pu2pny-*.img.xz.sha256 BUILD-INFO-*.json --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'PU2PNY-OS 5.10 ALPHA (ARM32/ARM64)' --notes-file release-notes.txt --prerelease
          gh release view pu2pny-v5.10.000 --repo "$GH_REPO" --json tagName,targetCommitish,assets
