name: Build 2PNY hotfix3

on:
  push:
    branches: [ main ]
    paths:
      - 'src/2pny-rf-apply'
      - 'ci/prepare-0.1.7-hotfix3-network-stability.sh'
      - 'ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh'
      - 'ci/validate-0.1.7-hotfix3-image.sh'
      - '.github/workflows/hotfix3-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hotfix3:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.7-hotfix3
      TAG: v0.1.7-hotfix3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch source
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh; do
              bash "$f" legacy-source/2pny-os
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          bash ./builder/validate-source.sh
          grep -q 'listenAddr.*0.0.0.0:80' src/2pnyd/main.go
          test "$(grep -Fc 'http.HandleFunc("/api/hardware"' src/2pnyd/main.go)" -eq 1
          grep -q '^key-mgmt=none$' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -q '^auth-alg=open$' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -q '^powersave=2$' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          ! grep -q '^psk=' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -q 'Do not restart firstboot' rootfs-overlay/etc/NetworkManager/dispatcher.d/90-2pny-connectivity
          grep -q 'AP ready at 10.42.0.1' rootfs-overlay/usr/local/sbin/2pny-setup-watch
          grep -q '^DumpTAData=1$' rootfs-overlay/usr/local/sbin/2pny-rf-apply
          bash -n rootfs-overlay/usr/local/sbin/2pny-ap-control
          bash -n rootfs-overlay/usr/local/sbin/2pny-setup-watch
          bash -n rootfs-overlay/usr/local/sbin/2pny-firstboot
          bash -n rootfs-overlay/usr/local/sbin/2pny-rf-apply

      - name: Build image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.7-hotfix3-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Publish prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.7 hotfix3 — Raspberry Pi ARM64.

          Correção focada no primeiro acesso em hardware real:
          - AP 2PNY-SETUP explicitamente aberto (key-mgmt=none/auth-alg=open), sem senha;
          - único serviço controla Ethernet/AP, eliminando disputa que podia derrubar associação do cliente;
          - AP saudável não é reiniciado enquanto o usuário conecta;
          - verificação obrigatória do IP 10.42.0.1 no Wi-Fi;
          - perfil AP é recriado automaticamente se estiver inconsistente;
          - economia de energia Wi-Fi desativada durante o setup;
          - botão de AP e estado persistente preservados;
          - captive portal e painel responsivo preservados;
          - DMR Talker Alias preparado no MMDVMHost com DumpTAData=1;
          - painel real iniciado e testado dentro da imagem no CI;
          - MMDVMHost, RF rollback e limites de memória preservados.

          Primeiro acesso: conecte em 2PNY-SETUP e abra http://10.42.0.1 se o captive portal não abrir automaticamente.
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.7 hotfix3' --notes-file RELEASE-NOTES.md --prerelease
