name: Build and release PU2PNY-OS 0.3.21 Alpha

on:
  push:
    branches: [ pu2pny-os-0.3.21-alpha ]
    paths:
      - 'src/**'
      - 'ci/**'
      - '.github/workflows/0.3.21-build-release.yml'
      - 'PU2PNY-OS_*.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pu2pny-os-0.3.21-alpha-release-final
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate protected baseline and 0.3.21 sources
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd-main-0.3.21.go src/direct-core-0.3.21/*.go
          go test src/2pnyd-main-0.3.21.go
          go test src/direct-core-0.3.21/*.go
          python3 ci/test-0.3.20-regressions.py
          python3 ci/test-0.3.21-regressions.py
          python3 -m py_compile \
            src/2pny-protocol-network-apply-0.3.21.py \
            src/2pny-station-worker-0.3.21.py \
            src/2pny-aprs-0.3.21.py \
            src/2pny-display-apply-0.3.21.py \
            src/2pny-display-core-0.3.21.py \
            src/2pny-dmr-duplex-diagnostics-0.3.21.py \
            src/2pny-rxoffset-apply-0.3.21.py \
            ci/patch-dmrgateway-voice-arbiter-0.3.21.py \
            ci/prepare-0.3.21-alpha.py \
            ci/test-0.3.21-regressions.py
          bash -n src/2pny-wifi-profiles-0.3.21 src/90-pu2pny-wifi-choice-0.3.21 ci/validate-0.3.21-image.sh
          node --check src/ui-common-0.3.21.js
          node --check src/ui-language-0.3.21.js
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['src/internet-0.3.21.html','src/hotspot-0.3.21.html','src/dashboard-0.3.21.html','src/wizard-0.3.21.html','src/aprs-0.3.21.html','src/system-0.3.21.html','src/display-0.3.21.html','src/direct-0.3.21.html']){
            const h=fs.readFileSync(f,'utf8');
            for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(m[1]);
          }
          NODE
          grep -Fq 'TG conectado' src/hotspot-0.3.21.html
          grep -Fq 'Salvar melhor ajuste' src/hotspot-0.3.21.html
          grep -Fq 'simplex-protected' src/2pny-protocol-network-apply-0.3.21.py
          grep -Fq 'connected_tg' src/2pny-station-worker-0.3.21.py
          grep -Fq 'SENDING' ci/patch-dmrgateway-voice-arbiter-0.3.21.py
          grep -Fq 'relay desativado' src/direct-core-0.3.21/direct_session.go

  build-arm64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: 0.3.21-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2 parted
      - name: Restore protected chain through 0.3.20 and apply focused 0.3.21 overlay
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in             ci/prepare-0.1.2.sh             ci/prepare-0.1.3.sh             ci/prepare-0.1.4-ui.sh             ci/prepare-0.1.5-hardware.sh             ci/prepare-0.1.5-fixes.sh             ci/prepare-0.1.6-rf.sh             ci/prepare-0.1.6-build-fix.sh             ci/prepare-0.1.7-modules.sh             ci/prepare-0.1.7-hotfix1-ethernet.sh             ci/prepare-0.1.7-hotfix2-listener-prep.sh             ci/prepare-0.1.7-hotfix2-captive-responsive.sh             ci/prepare-0.1.7-hotfix2-review-fixes.sh             ci/prepare-0.1.7-hotfix2-route-dedupe.sh             ci/prepare-0.1.7-hotfix3-network-stability.sh             ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh             ci/prepare-0.1.7-hotfix4-dual-network.sh             ci/prepare-0.1.7-hotfix4-validator-fix.sh             ci/prepare-0.1.7-hotfix5-bookworm-network.sh             ci/prepare-0.1.7-hotfix5-base-fix.sh             ci/prepare-0.1.7-hotfix5-validator-compat.sh             ci/prepare-0.1.8-anchor-compat.sh             ci/prepare-0.1.8-network-core.sh             ci/prepare-0.1.8-builder-service-fix.sh             ci/prepare-0.1.9-pu2pny-hardware-ui.sh             ci/prepare-0.1.9-network-pid-fix.sh             ci/prepare-0.1.9-build-metadata-fix.sh             ci/prepare-0.1.9-hotfix1-hardware-status.sh             ci/prepare-0.2.0-onboarding.sh             ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done
          python3 ci/prepare-0.2.2-stability.py legacy-source/2pny-os
          python3 ci/prepare-0.2.3-dashboard.py legacy-source/2pny-os
          python3 ci/prepare-0.2.4-network-display.py legacy-source/2pny-os
          python3 ci/prepare-0.2.5-protocol-network.py legacy-source/2pny-os
          python3 ci/prepare-0.2.7-radio-live.py legacy-source/2pny-os
          python3 ci/prepare-0.2.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.2.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.0-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.1-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.2-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.3-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.4-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.5-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.6-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.7-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.8-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.9-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.10-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.11-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.12-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.13-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.14-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.15-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.16-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.17-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.18-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.19-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.20-alpha.py legacy-source/2pny-os
          python3 ci/prepare-0.3.21-alpha.py legacy-source/2pny-os
      - name: Validate staged source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          python3 -m py_compile \
            rootfs-overlay/usr/local/sbin/2pny-station-worker \
            rootfs-overlay/usr/local/sbin/2pny-display-core \
            rootfs-overlay/usr/local/sbin/2pny-display-apply \
            rootfs-overlay/usr/local/sbin/2pny-display-detector \
            rootfs-overlay/usr/local/sbin/2pny-protocol-network-apply \
            rootfs-overlay/usr/local/sbin/2pny-protocol-profiles \
            rootfs-overlay/usr/local/sbin/2pny-update-manager \
            rootfs-overlay/usr/local/libexec/2pny-dmr-apply \
            rootfs-overlay/usr/local/sbin/2pny-aprs \
            rootfs-overlay/usr/local/sbin/2pny-timezone-apply \
            rootfs-overlay/usr/local/sbin/2pny-dmr-duplex-diagnostics \
            rootfs-overlay/usr/local/sbin/2pny-rxoffset-apply
          bash -n rootfs-overlay/usr/local/sbin/2pny-hostfiles-update rootfs-overlay/usr/local/sbin/2pny-display-online-detect
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.3\.21-alpha"' src/2pnyd/main.go
          grep -Fq 'simplex-protected' rootfs-overlay/usr/local/libexec/2pny-dmr-apply
          grep -Fq 'connected_tg' rootfs-overlay/usr/local/sbin/2pny-station-worker
          grep -Fq 'Saída ativa · retorno COMOK ainda não confirmado' rootfs-overlay/usr/share/2pny/display.html
          grep -Fq 'Salvar melhor ajuste' rootfs-overlay/usr/share/2pny/hotspot.html
          grep -Fq 'Salvar rede de backup' rootfs-overlay/usr/share/2pny/internet.html
          grep -Fq 'Aguardando confirmação real do gateway/rede' rootfs-overlay/usr/share/2pny/hotspot.html
          grep -Eq 'tx_only_unconfirmed|candidate_native_fallback' rootfs-overlay/usr/local/sbin/2pny-display-apply
          test -x rootfs-overlay/usr/local/sbin/2pny-rxoffset-apply
          test -L rootfs-overlay/etc/systemd/system/multi-user.target.wants/2pny-rxoffset-apply.path
          grep -Fq 'SystemMaxUse=64M' rootfs-overlay/etc/systemd/journald.conf.d/20-pu2pny.conf
          grep -Fq 'ACKDIAG' rootfs-overlay/usr/local/sbin/2pny-aprs
          grep -Fq 'Internet desconectada' rootfs-overlay/usr/share/2pny/ui-common-0.3.0.js
          test -x rootfs-overlay/usr/local/bin/2pny-direct-core
          rootfs-overlay/usr/local/bin/2pny-direct-core --selftest | grep -Fq DIRECT_SELFTEST_OK
          grep -Fq 'patch-dmrgateway-pu2pny-0.3.20.py' builder/build-image.sh
          grep -Fq 'patch-dmrgateway-voice-arbiter-0.3.21.py' builder/build-image.sh
      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh
      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/PU2PNY-OS-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"
      - name: Pre-validate generated image
        working-directory: legacy-source/2pny-os
        run: sudo bash "$GITHUB_WORKSPACE/ci/preflight-image.sh" "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$VERSION"
      - name: Validate final image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.3.21-image.sh" "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$VERSION"
      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/PU2PNY-OS-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-os-0.3.21-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.3.21-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-os-0.3.21-arm64
          path: release
      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/PU2PNY-OS-$VERSION-arm64.img.xz"
          xz -t "$IMAGE"
          test "$(awk '{print $1}' "$IMAGE.sha256")" = "$(sha256sum "$IMAGE" | awk '{print $1}')"
      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          PU2PNY-OS 0.3.21 Alpha — correções focais após o teste físico da 0.3.20.

          Baseline protegida:
          - D-Star simplex: HW PASS em 22/09/2026.
          - DMR simplex: HW PASS em 22/09/2026.
          - A correção duplex não autoriza alterar a semântica simplex aprovada.

          Principais mudanças para reteste:
          - DMR duplex: transporte local explícito TS1/TS2 somente em repetidora, diagnóstico de wakeup/downlink e correção do árbitro de voz para não silenciar áudio de rede enquanto anúncio está apenas aguardando.
          - DMR/XLX: painel separa TG solicitado do TG confirmado e mostra TG real em vez de módulo C obsoleto.
          - Ao Vivo: RX/TX do duplex em caixas separadas.
          - Protocolos: RX/TX em linhas próprias e overlay permanece aberto até confirmação real do gateway/rede.
          - DNS: convergência deixa de gerar rollback falso quando a resolução já funciona.
          - Wi-Fi: uma caixa visível para rede reserva, failover automático e histerese de sinal; dispatcher leve reage a eventos do NetworkManager.
          - Wizard/idioma: idioma inicial persistido no sistema e perguntado uma vez; com Internet já funcional o fluxo segue para Hardware.
          - Nextion: saída pode ser ativada sem fingir COMOK; estado TX-only permanece claramente não confirmado fisicamente.
          - Direct: rendezvous apenas para descoberta; tráfego de QSO é direto e relay de mídia é recusado. Chamada é acionada pela atividade real do rádio.
          - APRS: diagnóstico de ACK por origem+ID, latitude/longitude manual e documentação M-SMS/H-SMS; SMS DMR nativo continua experimental.
          - Relógio: NTP + fuso IANA automático; horário de verão manual altera somente a exibição.
          - Logs: journald persistente limitado a 64 MiB / 7 dias, comprimido.
          - BER: calibração assistida de RXOffset em passos de 100 Hz, usando apenas BER/RSSI reais e salvamento explícito do melhor valor observado.

          Validação desta release:
          - source, regressões herdadas, ARM64, XZ/SHA-256, REL-015, imagem montada e backend são gates obrigatórios;
          - nenhuma correção RF/Nextion/Direct desta versão é promovida a HW PASS sem novo teste físico.

          Estado: ALPHA / PARA TESTE FÍSICO.

          ---
          English summary:
          - 0.3.20 remains the protected base; D-Star simplex and DMR simplex were HW-approved on 2026-09-22.
          - 0.3.21 isolates DMR duplex fixes, keeps TS1/TS2 local transport in repeater mode, fixes voice arbitration and reports the confirmed TG instead of a stale DMR module.
          - DNS/Wi-Fi state, automatic backup Wi-Fi, one-time language selection, Direct radio-triggered P2P, APRS ACK diagnostics, automatic time/DST display, bounded logs, BER RXOffset guidance and truthful Nextion COMOK state are included.
          - RF, Nextion and two-hotspot Direct changes remain pending physical retest.

          Resumen en español:
          - 0.3.20 sigue siendo la base protegida; D-Star simplex y DMR simplex fueron aprobados en hardware el 22/09/2026.
          - 0.3.21 aísla las correcciones DMR dúplex, mantiene TS1/TS2 locales en modo repetidor, corrige el arbitraje de voz y muestra el TG confirmado en lugar de un módulo DMR obsoleto.
          - Incluye estado DNS/Wi-Fi más preciso, Wi-Fi de respaldo automático, idioma inicial persistente, Direct P2P iniciado por radio, diagnóstico ACK APRS, reloj automático/DST de presentación, logs limitados, guía BER/RXOffset y estado Nextion COMOK fiel.
          - RF, Nextion y Direct entre dos hotspots siguen pendientes de prueba física.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.21-alpha
          target_commitish: ${{ github.sha }}
          name: PU2PNY-OS 0.3.21 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/PU2PNY-OS-0.3.21-alpha-arm64.img.xz
            release/PU2PNY-OS-0.3.21-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
