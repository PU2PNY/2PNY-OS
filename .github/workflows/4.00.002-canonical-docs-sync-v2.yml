name: PU2PNY-OS 4.00.002 Canonical Docs Sync v2

on:
  push:
    branches: [pu2pny-os-4.00.002-display-pistar-helix]
    paths:
      - '.github/workflows/4.00.002-canonical-docs-sync-v2.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pu2pny-os-4.00.002-display-pistar-helix
          fetch-depth: 1
      - name: Apply canonical block and normalize EOF
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/4.00.002-canonical-docs-sync.yml').read_text()
          chunk = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(chunk), {})
          for name in ('PU2PNY-OS_MASTER_SPEC.md','PU2PNY-OS_CHANGELOG.md','PU2PNY-OS_RELEASE_STATUS.md','PU2PNY-OS_TEST_MATRIX.md'):
              p = Path(name)
              p.write_text(p.read_text().rstrip() + '\n')
          PY
          git diff --check
          if git diff --quiet; then
            echo DOCS_ALREADY_SYNCED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PU2PNY-OS_MASTER_SPEC.md PU2PNY-OS_CHANGELOG.md PU2PNY-OS_RELEASE_STATUS.md PU2PNY-OS_TEST_MATRIX.md
          git commit -m 'docs: register 4.00.002 display and Helix gates'
          git push origin HEAD:pu2pny-os-4.00.002-display-pistar-helix
