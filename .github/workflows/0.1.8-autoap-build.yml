name: Build 2PNY 0.1.8 AutoAP

on:
  push:
    branches: [ network-ap-rebuild-0.1.8 ]
    paths:
      - 'ci/prepare-0.1.8-network-ap.sh'
      - 'ci/prepare-0.1.8-network-ap-fix1.sh'
      - 'ci/prepare-0.1.8-bookworm-pin.sh'
      - 'ci/prepare-0.1.8-validator-cleanup.sh'
      - 'ci/validate-0.1.8-autoap-image.sh'
      - '.github/workflows/0.1.8-autoap-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.8-alpha
      TAG: v0.1.8-alpha
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore owned source and apply patches
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh; do
              if [ -f "$f" ]; then bash "$f" legacy-source/2pny-os; fi
          done
          bash ci/prepare-0.1.8-network-ap-fix1.sh legacy-source/2pny-os
          bash ci/prepare-0.1.8-network-ap.sh legacy-source/2pny-os
          bash ci/prepare-0.1.8-bookworm-pin.sh legacy-source/2pny-os
          bash ci/prepare-0.1.8-validator-cleanup.sh legacy-source/2pny-os

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          bash ./builder/validate-source.sh
          grep -Fq '2026-09-15-raspios-bookworm-arm64-lite.img.xz' builder/build-image.sh
          grep -Fq 'bcaefdf9c40dbed31dcaeb3b8494e498b4f1e3078c2604b0d9f5f595f8f6fd91' builder/build-image.sh
          grep -Fq 'ssid=2PNY-SETUP' rootfs-overlay/etc/hostapd/hostapd-2pny.conf
          grep -Fq '10.42.0.20,10.42.0.80' rootfs-overlay/etc/dnsmasq.d/2pny-setup.conf
          grep -Fq '10.43.0.20,10.43.0.80' rootfs-overlay/etc/dnsmasq.d/2pny-setup.conf
          grep -Fq '2pny-networkd' rootfs-overlay/etc/systemd/system/2pny-networkd.service

      - name: Build Raspberry Pi ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate final image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.8-autoap-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2PNY-OS-${{ env.VERSION }}-arm64
          path: |
            legacy-source/2pny-os/dist/2PNY-OS-${{ env.VERSION }}-arm64.img.xz
            legacy-source/2pny-os/dist/2PNY-OS-${{ env.VERSION }}-arm64.img.xz.sha256
            legacy-source/2pny-os/dist/BUILD-INFO.txt
          retention-days: 7
