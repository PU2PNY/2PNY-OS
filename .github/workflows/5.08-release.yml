name: PU2PNY-OS 5.08 ALPHA ARM32 ARM64
on:
  push:
    branches: [release/pu2pny-5.08]
    paths-ignore:
      - 'PU2PNY-OS_MASTER_SPEC.md'
      - 'PU2PNY-OS_CHANGELOG.md'
      - 'PU2PNY-OS_RELEASE_STATUS.md'
      - 'PU2PNY-OS_TEST_MATRIX.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu2pny-5.08-release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Software regression and backend compile
        run: |
          set -euo pipefail
          python3 ci/test-5.03-profile-retry.py
          python3 ci/test-5.03-oled.py
          python3 ci/test-display-045-boot-reapply.py
          python3 ci/test-net-045-wifi-autoconnect.py
          python3 ci/test-5.02.1-overlay.py
          python3 ci/test-expert-054.py 5.04
          python3 ci/test-expert-054.py 5.05
          python3 ci/test-expert-054.py 5.06
          python3 ci/test-identity-054.py
          python3 ci/test-lcd-054.py
          python3 ci/test-5.04-overlay.py
          python3 ci/test-5.05-display.py
          python3 ci/test-5.06.py
          python3 ci/test-5.07.py
          python3 ci/test-5.08.py
          python3 ci/test-expert-054.py 5.07
          python3 ci/test-expert-054.py 5.08
          python3 -m py_compile ci/build-5.08.py ci/patch-image-5.08.py ci/prepare-5.08-backend.py runtime/5.08/tz-apply.py runtime/5.08/expert-cmd.py runtime/5.08/i2c.py
          python3 ci/prepare-5.08-backend.py "$RUNNER_TEMP/backend"
          (cd "$RUNNER_TEMP/backend" && GO111MODULE=off go vet . && GO111MODULE=off go test -count=1 -v)
          python3 ci/prepare-5.08-backend.py "$RUNNER_TEMP/backend32" arm32
          (cd "$RUNNER_TEMP/backend32" && GO111MODULE=off go vet .)
          git diff --check

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Image inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xz-utils e2fsprogs util-linux file >/dev/null
      - name: Cross-build backend and download published immutable 5.07 base
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/work/output"
          if [ "$arch" = arm32 ]; then
            python3 ci/prepare-5.08-backend.py "$RUNNER_TEMP/backend" arm32
          else
            python3 ci/prepare-5.08-backend.py "$RUNNER_TEMP/backend"
          fi
          if [ "$arch" = arm32 ]; then
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -o "$RUNNER_TEMP/work/2pnyd-arm" .)
            file "$RUNNER_TEMP/work/2pnyd-arm" | grep -E 'ELF 32-bit.*ARM'
            asset=pu2pny-32-5.07.img.xz
          else
            (cd "$RUNNER_TEMP/backend" && GO111MODULE=off CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/work/2pnyd-arm64" .)
            file "$RUNNER_TEMP/work/2pnyd-arm64" | grep -Ei 'ELF 64-bit.*aarch64'
            asset=pu2pny-64-5.07.img.xz
          fi
          curl -fL --retry 4 --retry-all-errors "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.07.000/$asset" -o "$RUNNER_TEMP/work/base-$arch.img.xz"
      - name: Full-manifest scope, rollback, filesystem, XZ and SHA
        run: |
          set -euo pipefail
          sudo python3 ci/build-5.08.py "$RUNNER_TEMP/work" '${{ matrix.arch }}' "$GITHUB_SHA"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/work/output"
          cd "$RUNNER_TEMP/work/output"
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-5.08-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz.sha256
            ${{ runner.temp }}/work/output/BUILD-INFO-*.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-5.08-*
          merge-multiple: true
      - name: Final integrity and metadata
        run: |
          set -euo pipefail
          for arch in 32 64; do
            f="pu2pny-$arch-5.08.img.xz"
            test -s "$f"
            xz -t "$f"
            sha256sum -c "$f.sha256"
          done
          python3 - <<'PY'
          import json
          for arch in ('arm32', 'arm64'):
              info = json.load(open('BUILD-INFO-' + arch + '.json'))
              assert info['version'] == '5.08.000'
              assert info['validation']['filesystem'] == 'PASS'
              assert info['validation']['full_scope_manifest'] == 'PASS'
              assert info['validation']['rf_binary_preservation'] == 'PASS'
              assert info['validation']['HW'] == 'NOT_VERIFIED'
          PY
      - name: Publish hardware-test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat >release-notes.txt <<EOF
          PU2PNY-OS 5.08.000 ALPHA / NOT PRODUCTION / NOT HW VERIFIED.
          Source: $GITHUB_SHA. Base: published 5.07.000, SHA-256 verified.
          CLOCK-058: the zone is written to /etc/localtime directly and confirmed from that link (5.06 trusted `timedatectl`, which reads /etc/timezone, so London stayed). The System page and the browser sync read the clock from files instead of starting systemd-timedated on every poll; the boot restore uses the same link.
          DISPLAY-058: i2c-dev is loaded at boot and before the display core (no /dev/i2c-1 existed, so no OLED/LCD could be found); an I2C OLED/LCD that answers on the bus now wins over a Nextion nobody confirmed physically, and applying "Nextion through the modem" no longer stops the display core when such a display is present. Display apply limit 35 s -> 120 s.
          SPEED-058: the operator name/city appear first and the photo downloads as a separate job; lookups every 4 s instead of 15 s; masked units a headless hotspot never uses: apt-daily, apt-daily-upgrade, man-db, e2scrub_all, dpkg-db-backup timers, ModemManager, triggerhappy, udisks2. To undo: remove the symlink in /etc/systemd/system and enable the unit.
          BOOT-058: userconfig.service (first-boot user dialog waiting for a console) is masked; it kept the boot "not finished" forever.
          UI-058: Wi-Fi percentage from dBm when NetworkManager gives none; Wi-Fi/Internet bars are green (great), yellow (good), red (bad); PU2PNY-OS logo in the header and favicon on every page.
          EXPERT-058: Wi-Fi (saved connections, scan list, link, NM log), warnings/errors since boot, and boot timeline of key units.
          NOT FIXED / NOT PROVEN: repeated MMDVMHost restarts (protected RF scripts), why wlan0 stayed disconnected on the Pi 4 test, Nextion fields, crossmode, Orange Pi/NanoPi images (planned for 5.09).
          EOF
          gh release create pu2pny-v5.08.000 pu2pny-*.img.xz pu2pny-*.img.xz.sha256 BUILD-INFO-*.json --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'PU2PNY-OS 5.08 ALPHA (ARM32/ARM64)' --notes-file release-notes.txt --prerelease
          gh release view pu2pny-v5.08.000 --repo "$GH_REPO" --json tagName,targetCommitish,assets
