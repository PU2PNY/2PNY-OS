name: Build and release pu2pnu-os 0.2.1 Alpha

on:
  push:
    branches: [ pu2pny-os-0.2.1-alpha ]
    paths:
      - 'src/2pnyd-main-0.2.0.go'
      - 'src/2pny-network-core-0.2.0'
      - 'src/2pny-network-switch-0.2.0'
      - 'src/2pny-hardware-prepare-0.2.0'
      - 'src/2pny-mode-apply-0.2.0'
      - 'src/wizard-0.2.0.html'
      - 'ci/prepare-0.2.0-onboarding.sh'
      - 'src/2pnyd-main-0.2.1.go'
      - 'src/2pny-network-core-0.2.1'
      - 'src/2pny-network-switch-0.2.1'
      - 'src/wizard-0.2.1.html'
      - 'ci/prepare-0.2.1-network-ux.sh'
      - 'ci/validate-0.2.1-image.sh'
      - '.github/workflows/0.2.1-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      VERSION: 0.2.1-alpha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Restore baseline and apply 0.2.0
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh \
            ci/prepare-0.1.7-hotfix5-bookworm-network.sh \
            ci/prepare-0.1.7-hotfix5-base-fix.sh \
            ci/prepare-0.1.7-hotfix5-validator-compat.sh \
            ci/prepare-0.1.8-anchor-compat.sh \
            ci/prepare-0.1.8-network-core.sh \
            ci/prepare-0.1.8-builder-service-fix.sh \
            ci/prepare-0.1.9-pu2pny-hardware-ui.sh \
            ci/prepare-0.1.9-network-pid-fix.sh \
            ci/prepare-0.1.9-build-metadata-fix.sh \
            ci/prepare-0.1.9-hotfix1-hardware-status.sh \
            ci/prepare-0.2.0-onboarding.sh \
            ci/prepare-0.2.1-network-ux.sh; do
              bash "$f" legacy-source/2pny-os
          done

      - name: Validate 0.2.1 source
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          gofmt -w src/2pnyd/main.go
          go test ./...
          for f in \
            rootfs-overlay/usr/local/sbin/2pny-network-core \
            rootfs-overlay/usr/local/sbin/2pny-network-switch \
            rootfs-overlay/usr/local/sbin/2pny-ap-control \
            rootfs-overlay/usr/local/sbin/2pny-hardware-drivers \
            rootfs-overlay/usr/local/sbin/2pny-hardware-prepare \
            rootfs-overlay/usr/local/sbin/2pny-mode-apply \
            rootfs-overlay/usr/local/sbin/2pny-mdns-alias; do
              bash -n "$f"
          done
          python3 -m py_compile rootfs-overlay/usr/local/sbin/2pny-hardware-probe
          rm -rf rootfs-overlay/usr/local/sbin/__pycache__
          grep -Eq 'appVersion[[:space:]]*=[[:space:]]*"0\.2\.0-alpha"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/connectivity"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/network/connect"' src/2pnyd/main.go
          grep -Fq 'http.HandleFunc("/api/basic/apply"' src/2pnyd/main.go
          grep -Fq 'Primeiro acesso — Internet' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq 'Preparando hardware' rootfs-overlay/usr/share/2pny/wizard.html
          grep -Fq 'Configuração básica' rootfs-overlay/usr/share/2pny/wizard.html
          ! grep -qi 'offset' rootfs-overlay/usr/share/2pny/wizard.html
          ! grep -qi 'porta mmdvm' rootfs-overlay/usr/share/2pny/wizard.html
          grep -qx 'dhcp-option=3' rootfs-overlay/usr/share/2pny/network/dnsmasq-eth.template
          grep -qx 'dhcp-option=6' rootfs-overlay/usr/share/2pny/network/dnsmasq-eth.template
          grep -Fq 'MASQUERADE' rootfs-overlay/usr/local/sbin/2pny-network-core
          grep -Fq '10.43.0.11/24' rootfs-overlay/usr/local/sbin/2pny-network-core
          grep -Fq 'LAST_CARRIER' rootfs-overlay/usr/local/sbin/2pny-network-core
          grep -Fq 'scan-json' rootfs-overlay/usr/local/sbin/2pny-network-switch
          grep -q '^ssid=pu2pny

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/pu2pnu-os-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"

      - name: Validate final 0.2.1 image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.2.1-image.sh" "dist/pu2pnu-os-$VERSION-arm64.img.xz" "$VERSION"

      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/pu2pnu-os-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/pu2pnu-os-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pnu-os-0.2.1-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-x64:
    needs: build-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: 0.2.1-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pu2pnu-os-0.2.1-arm64
          path: release

      - name: Verify transferred image
        run: |
          set -euo pipefail
          IMAGE="release/pu2pnu-os-$VERSION-arm64.img.xz"
          CHECKSUM="$IMAGE.sha256"
          test -s "$IMAGE"
          test -s "$CHECKSUM"
          xz -t "$IMAGE"
          EXPECTED="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "artifact verified sha256=$ACTUAL"

      - name: Write release notes
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          pu2pnu-os 0.2.1 Alpha — Raspberry Pi ARM64.

          Novo assistente profissional:
          - fluxo: Internet -> Hardware -> Configuração básica -> Conclusão;
          - internet configurada antes da preparação de hardware;
          - Ethernet tenta DHCP antes do fallback local 10.43.0.1;
          - fallback direto não anuncia gateway nem DNS para não derrubar a internet Wi-Fi do computador;
          - duas interfaces Wi-Fi podem separar AP e internet;
          - AP pode compartilhar o uplink durante a configuração;
          - preparação segura de drivers e firmware por pacotes oficiais;
          - detecção automática de Raspberry Pi, MMDVM e display;
          - tela básica sem offsets e sem mostrar porta MMDVM;
          - indicativo, DMR ID, Hotspot/Repetidora, RX/TX, protocolo e Normal/Crossmode;
          - dark mode padrão, tema claro opcional e layout responsivo.

          Primeiro acesso:
          AP: pu2pny (aberto) -> http://10.42.0.1
          Cabo direto fallback -> http://10.43.0.1
          Rede normal -> http://pu2pny.local
          EOF

      - name: Publish verified prerelease and assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.1-alpha
          target_commitish: pu2pny-os-0.2.1-alpha
          name: pu2pnu-os 0.2.1 Alpha
          prerelease: true
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/pu2pnu-os-0.2.1-alpha-arm64.img.xz
            release/pu2pnu-os-0.2.1-alpha-arm64.img.xz.sha256
            release/BUILD-INFO.txt
 rootfs-overlay/usr/share/2pny/network/hostapd.template
          grep -q '^dhcp-option-force=114,http://10.42.0.1/captive-api

      - name: Build ARM64 image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Normalize image and checksum
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          OLD="$(sudo find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          IMAGE="dist/pu2pnu-os-$VERSION-arm64.img.xz"
          test -n "$OLD"
          if [[ "$OLD" != "$IMAGE" ]]; then sudo mv "$OLD" "$IMAGE"; fi
          sudo rm -f dist/*.img.xz.sha256
          HASH="$(sudo sha256sum "$IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$IMAGE")" | sudo tee "$IMAGE.sha256" >/dev/null
          sudo chown "$USER:$USER" "$IMAGE" "$IMAGE.sha256" dist/BUILD-INFO.txt
          xz -t "$IMAGE"
          test "$(sha256sum "$IMAGE" | awk '{print $1}')" = "$HASH"

      - name: Validate final 0.2.1 image
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.2.1-image.sh" "dist/pu2pnu-os-$VERSION-arm64.img.xz" "$VERSION"

      - name: Stage validated artifact
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          cp "dist/pu2pnu-os-$VERSION-arm64.img.xz" "$GITHUB_WORKSPACE/release-artifact/"
          cp "dist/pu2pnu-os-$VERSION-arm64.img.xz.sha256" "$GITHUB_WORKSPACE/release-artifact/"
          cp dist/BUILD-INFO.txt "$GITHUB_WORKSPACE/release-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: pu2pnu-os-0.2.1-arm64
          path: release-artifact/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

