name: Build 2PNY hotfix4

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/prepare-0.1.7-hotfix4-dual-network.sh'
      - 'ci/prepare-0.1.7-hotfix4-validator-fix.sh'
      - 'ci/validate-0.1.7-hotfix4-image.sh'
      - '.github/workflows/hotfix4-build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hotfix4:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: 0.1.7-hotfix4
      TAG: v0.1.7-hotfix4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PU2PNY/XLX-Modern-Installer
          ref: 2pny-os-build
          path: legacy-source

      - name: Restore and patch source
        run: |
          set -euo pipefail
          bash legacy-source/2pny-os/bootstrap.sh
          for f in \
            ci/prepare-0.1.2.sh \
            ci/prepare-0.1.3.sh \
            ci/prepare-0.1.4-ui.sh \
            ci/prepare-0.1.5-hardware.sh \
            ci/prepare-0.1.5-fixes.sh \
            ci/prepare-0.1.6-rf.sh \
            ci/prepare-0.1.6-build-fix.sh \
            ci/prepare-0.1.7-modules.sh \
            ci/prepare-0.1.7-hotfix1-ethernet.sh \
            ci/prepare-0.1.7-hotfix2-listener-prep.sh \
            ci/prepare-0.1.7-hotfix2-captive-responsive.sh \
            ci/prepare-0.1.7-hotfix2-review-fixes.sh \
            ci/prepare-0.1.7-hotfix2-route-dedupe.sh \
            ci/prepare-0.1.7-hotfix3-network-stability.sh \
            ci/prepare-0.1.7-hotfix3-compat-talkeralias.sh \
            ci/prepare-0.1.7-hotfix4-dual-network.sh \
            ci/prepare-0.1.7-hotfix4-validator-fix.sh; do
              bash "$f" legacy-source/2pny-os
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file iproute2

      - name: Validate source
        working-directory: legacy-source/2pny-os
        run: |
          set -euxo pipefail
          bash ./builder/validate-source.sh
          grep -Fq '0.0.0.0:80' src/2pnyd/main.go
          grep -Fq 'address1=10.42.0.1/24' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -Fq 'address1=10.43.0.1/24' rootfs-overlay/etc/NetworkManager/system-connections/2pny-ethernet-setup.nmconnection
          grep -Fq 'key-mgmt=none' rootfs-overlay/etc/NetworkManager/system-connections/2pny-setup.nmconnection
          grep -Fq 'Ethernet direct access is independent' rootfs-overlay/usr/local/sbin/2pny-setup-watch
          grep -Fq 'Wi-Fi AP is also independent' rootfs-overlay/usr/local/sbin/2pny-setup-watch
          grep -Fq 'DumpTAData=1' rootfs-overlay/usr/local/sbin/2pny-rf-apply
          bash -n rootfs-overlay/usr/local/sbin/2pny-ap-control
          bash -n rootfs-overlay/usr/local/sbin/2pny-setup-watch
          bash -n rootfs-overlay/usr/local/sbin/2pny-firstboot

      - name: Build image
        working-directory: legacy-source/2pny-os
        run: sudo -E VERSION="$VERSION" ./builder/build-image.sh

      - name: Validate image and execute panel
        working-directory: legacy-source/2pny-os
        run: bash "$GITHUB_WORKSPACE/ci/validate-0.1.7-hotfix4-image.sh" "dist/2PNY-OS-${VERSION}-arm64.img.xz" "$VERSION"

      - name: Publish prerelease
        working-directory: legacy-source/2pny-os
        run: |
          set -euo pipefail
          IMAGE="dist/2PNY-OS-${VERSION}-arm64.img.xz"
          cat > RELEASE-NOTES.md <<'EOF'
          2PNY OS 0.1.7 hotfix4 — Raspberry Pi ARM64.

          Correção de primeiro acesso:
          - Ethernet direta e Wi-Fi AP funcionam simultaneamente;
          - conectar o cabo não desliga o SSID 2PNY-SETUP;
          - ativar o AP não desliga a Ethernet;
          - Wi-Fi AP aberto em 10.42.0.1/24;
          - Ethernet direta em 10.43.0.1/24, com DHCP pelo NetworkManager shared mode;
          - painel continua ouvindo em 0.0.0.0:80 e acessível pelos dois caminhos;
          - detecção de interfaces tem fallback em /sys para boot inicial;
          - botão liga/desliga do AP preservado e afeta somente o AP;
          - captive portal Wi-Fi e layout responsivo preservados;
          - DMR Talker Alias preservado com DumpTAData=1;
          - MMDVMHost, RF rollback e limites de memória preservados;
          - imagem montada e painel real executado no CI antes da publicação.

          Primeiro acesso Wi-Fi: conecte em 2PNY-SETUP e abra http://10.42.0.1.
          Primeiro acesso por cabo direto: abra http://10.43.0.1.
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IMAGE" "${IMAGE}.sha256" dist/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title '2PNY OS 0.1.7 hotfix4' --notes-file RELEASE-NOTES.md --prerelease
