name: PU2PNY-OS 0.3.31.112 recovery comment fix

on:
  push:
    branches: [ pu2pny-os-0.3.31.112-recovery ]
    paths:
      - '.github/workflows/0.3.31.112-docstring-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pu2pny-os-0.3.31.112-recovery
      - name: Remove false-positive token from documentation only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/2pny-update-manager-0.3.31.112.py')
          s=p.read_text()
          old='- arbitrary shell execution, curl|bash and unconstrained paths are forbidden.'
          new='- arbitrary shell execution, piped remote installers and unconstrained paths are forbidden.'
          if s.count(old)!=1:
              raise SystemExit('expected documentation anchor missing or ambiguous')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- src/2pny-update-manager-0.3.31.112.py
      - name: Full recovery SW gate
        run: |
          set -euo pipefail
          python3 -m py_compile src/2pny-update-manager-0.3.31.112.py src/2pny-update-entrypoint-0.3.31.112.py ci/test-0.3.31.112-update-recovery.py ci/test-0.3.31.112-service-policy.py
          python3 ci/test-0.3.31.112-update-recovery.py
          python3 ci/test-0.3.31.112-service-policy.py
          files=(src/2pny-update-manager-0.3.31.112.py src/2pny-update-entrypoint-0.3.31.112.py)
          if grep -nE '(^|[^A-Za-z])(eval|exec)\s*\(|curl[[:space:]]*\|[[:space:]]*(ba)?sh|shell[[:space:]]*=[[:space:]]*True' "${files[@]}"; then
            echo 'ERROR: unsafe execution pattern found' >&2
            exit 1
          fi
          git diff --exit-code pu2pny-os-0.3.31.110...HEAD -- src/2pny-update-manager-0.3.20.py
      - name: Commit only comment correction
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- src/2pny-update-manager-0.3.31.112.py)"
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M src/2pny-update-manager-0.3.31.112.py$' || true)"
          git config user.name 'PU2PNY CI'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add src/2pny-update-manager-0.3.31.112.py
          git commit -m 'docs: avoid recovery security-gate false positive'
          git push origin HEAD:pu2pny-os-0.3.31.112-recovery
