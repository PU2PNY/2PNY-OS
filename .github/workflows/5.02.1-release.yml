name: PU2PNY-OS 5.02.1 ARM32 ARM64 release
on:
  push:
    branches: [release/pu2pny-5.02.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu2pny-v5.02.1-alpha-release
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests and overlay regression
        run: |
          set -euo pipefail
          python3 ci/test-display-045-boot-reapply.py
          python3 ci/test-net-045-wifi-autoconnect.py
          python3 ci/test-5.02.1-overlay.py
          python3 -m py_compile ci/patch-image-5.02.1.py ci/build-5.02.1.py runtime/display/apply.py runtime/5x/2pny-wifi-apply.py runtime/5x/2pny-wifi-retry-reconcile.py
          git diff --check
  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xz-utils e2fsprogs util-linux file >/dev/null
      - name: Download published 5.02 base
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/work/output"
          if [ "$arch" = arm32 ]; then asset=pu2pny-32-5.02.img.xz; else asset=pu2pny-64-5.02.img.xz; fi
          curl -fL --retry 4 --retry-all-errors "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.02/$asset" -o "$RUNNER_TEMP/work/base-$arch.img.xz"
      - name: Verify scope, build image and SHA
        run: |
          set -euo pipefail
          sudo python3 ci/build-5.02.1.py "$RUNNER_TEMP/work" '${{ matrix.arch }}' "$GITHUB_SHA"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/work/output"
          cd "$RUNNER_TEMP/work/output"
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-5.02.1-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz
            ${{ runner.temp }}/work/output/pu2pny-*.img.xz.sha256
            ${{ runner.temp }}/work/output/BUILD-INFO-*.json
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pu2pny-5.02.1-*
          merge-multiple: true
      - name: Final integrity and metadata
        run: |
          set -euo pipefail
          for arch in 32 64; do
            f="pu2pny-$arch-5.02.1.img.xz"
            test -s "$f"
            xz -t "$f"
            sha256sum -c "$f.sha256"
          done
          python3 - <<'PY'
          import json
          for arch in ('arm32', 'arm64'):
              info = json.load(open('BUILD-INFO-' + arch + '.json'))
              assert info['version'] == '5.02.001' and info['validation']['filesystem'] == 'PASS'
              assert info['validation']['HW'] == 'NOT_VERIFIED'
          PY
      - name: Release two candidate images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat >release-notes.txt <<EOF
          PU2PNY-OS v5.02.1 ALPHA; NOT PRODUCTION; NOT HW VERIFIED.
          Source: $GITHUB_SHA. Base: published v5.02 ARM32 and ARM64 images (SHA-256 verified).
          Scope: DISPLAY-045 (saved Nextion-via-MMDVM profile is reapplied after reboot) and NET-045 (saved Wi-Fi profiles retry autoconnect forever).
          RF, MMDVMHost, gateways, NextionDriver, MMDVM-Display, 2pnyd and the profile autostart are byte-identical to 5.02.
          Not addressed: profile restore after reboot (cause unproven), boot speed, OLED/LCD extra data, callsign/ID editing.
          EOF
          gh release create pu2pny-v5.02.1 pu2pny-*.img.xz pu2pny-*.img.xz.sha256 BUILD-INFO-*.json --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'PU2PNY-OS 5.02.1 ARM32 ARM64 ALPHA' --notes-file release-notes.txt --prerelease
          gh release view pu2pny-v5.02.1 --repo "$GH_REPO" --json tagName,targetCommitish,assets
