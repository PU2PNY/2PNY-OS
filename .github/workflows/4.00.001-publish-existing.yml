name: PU2PNY-OS 4.00.001 Publish Verified Build

on:
  push:
    branches: [pu2pny-os-4.00.001-display-perf-timezone]
    paths:
      - '.github/workflows/4.00.001-publish-existing.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: v4.00.001
  SOURCE_SHA: 52e95cd61913637840ec9d9db86318ea256e2ccf
  SOURCE_RUN_ID: '38674274694'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact verified build artifacts
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: pu2pny-os-4.00.001-v2-*
          merge-multiple: true

      - name: Reverify and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c PU2PNY-OS-4.00.001-arm64.img.xz.sha256
          sha256sum -c PU2PNY-OS-4.00.001-arm32-pizero.img.xz.sha256
          xz -t PU2PNY-OS-4.00.001-arm64.img.xz
          xz -t PU2PNY-OS-4.00.001-arm32-pizero.img.xz
          grep -Fq "source_commit=${SOURCE_SHA}" BUILD-INFO-arm64.txt
          grep -Fq "source_commit=${SOURCE_SHA}" BUILD-INFO-arm32.txt
          grep -Fq 'classification=CANDIDATA_PARA_TESTE_FISICO' BUILD-INFO-arm64.txt
          grep -Fq 'classification=CANDIDATA_PARA_TESTE_FISICO' BUILD-INFO-arm32.txt
          grep -Fq 'nextion_hw=PENDENTE' BUILD-INFO-arm64.txt
          grep -Fq 'nextion_hw=PENDENTE' BUILD-INFO-arm32.txt

          cat > /tmp/notes.md <<'EOF'
          ## PU2PNY-OS 4.00.001 — CANDIDATA PARA TESTE FÍSICO

          Artefatos produzidos e validados no source commit `52e95cd61913637840ec9d9db86318ea256e2ccf`, run `38674274694`, derivados diretamente das imagens imutáveis `v4.00.000`.

          - **DISPLAY-032:** ON7LDS NextionDriver em foreground sob `Type=simple`; `Port=modem` + Transparent Data do MMDVMHost seguem a rota compatível com Pi-Star/WPSD. Nenhum HMI/TFT é auto-gravado.
          - **BOOT-051:** fuso IANA salvo é reaplicado no boot sem nova geolocalização; validação VPS concluída.
          - **PERF-051:** watcher Ao Vivo ajustado de 80 ms para 160 ms sem alteração do contrato RF/API/SSE.
          - **ARCH-010:** software/local permanece a direção aprovada; Helix/HVC/AMBE não validado continua bloqueado para produção.

          **HW-400001-NEXTION permanece PENDENTE.** Não há declaração de BER/RSSI/TX/RX, duplex ou Nextion física aprovada antes do reteste real.
          EOF

          assets=(
            PU2PNY-OS-4.00.001-arm64.img.xz
            PU2PNY-OS-4.00.001-arm64.img.xz.sha256
            PU2PNY-OS-4.00.001-arm32-pizero.img.xz
            PU2PNY-OS-4.00.001-arm32-pizero.img.xz.sha256
            BUILD-INFO-arm64.txt
            BUILD-INFO-arm32.txt
            PROTECTED-HASHES-arm64.txt
            PROTECTED-HASHES-arm32.txt
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title 'PU2PNY-OS 4.00.001 — Display / Timezone / ARM32' --notes-file /tmp/notes.md --prerelease --target "$SOURCE_SHA"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$SOURCE_SHA" --title 'PU2PNY-OS 4.00.001 — Display / Timezone / ARM32' --notes-file /tmp/notes.md --prerelease
          fi

          gh release view "$RELEASE_TAG" --json url,isPrerelease,tagName,targetCommitish,assets
