name: Publish PU2PNY ARM32 Experimental

on:
  push:
    branches: [ exp/0.3.6-arm32-poc-20260920 ]
    paths:
      - '.github/workflows/0.3.6-arm32-publish.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '35545030803'
      ARTIFACT: 'pu2pny-os-0.3.6-arm32-experimental'
      TAG: 'v0.3.6-arm32-experimental-1'
    steps:
      - uses: actions/checkout@v4
      - name: Download already validated ARM32 artifact
        run: |
          set -Eeuo pipefail
          mkdir -p arm32-release
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir arm32-release
          ls -lh arm32-release
      - name: Verify image checksum
        run: |
          set -Eeuo pipefail
          cd arm32-release
          sha256sum -c PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz.sha256
          xz -t PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz
          cat PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz.sha256
      - name: Write experimental release notes
        run: |
          cat > ARM32-RELEASE-NOTES.md <<'EOF'
          # PU2PNY-OS 0.3.6 ARM32 — EXPERIMENTAL / HW-TEST

          Esta imagem é destinada exclusivamente a testes em Raspberry Pi antigos.

          - Base: Raspberry Pi OS Legacy Lite Bookworm 32-bit (armhf), 15/09/2026.
          - 2pnyd: GOARCH=arm / GOARM=6.
          - Build, XZ/SHA-256 e validação estrutural: PASS.
          - 2pnyd, MMDVM-Host, DMRGateway, D-Star, YSF, P25, NXDN e DAPNET: confirmados ELF 32-bit ARM EABI5.
          - Hardware real antigo: PENDENTE.
          - DMR da 0.3.5 continua baseline e deve ser retestado fisicamente.

          Não classificar esta imagem como produção, HW PASS ou substituta da ARM64.
          Para testar, use cartão SD separado, alimentação estável e preserve sua imagem funcional anterior.
          EOF
      - name: Publish isolated prerelease
        run: |
          set -Eeuo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            arm32-release/PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz \
            arm32-release/PU2PNY-OS-0.3.6-alpha-arm32-EXPERIMENTAL.img.xz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target exp/0.3.6-arm32-poc-20260920 \
            --title 'PU2PNY-OS 0.3.6 ARM32 Experimental 1' \
            --notes-file ARM32-RELEASE-NOTES.md \
            --prerelease
