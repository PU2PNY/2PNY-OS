<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PU2PNY — Histórico</title><link rel="stylesheet" href="/ui-0.3.0.css"><style>
.bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.histtable{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px}.histtable th,.histtable td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.histtable th{font-size:9px;text-transform:uppercase;color:var(--muted)}.histtable .call{font-weight:900;color:var(--blue)}.histtable .clip{max-width:145px;overflow:hidden;text-overflow:ellipsis}.flag{width:20px;height:14px;object-fit:cover;vertical-align:middle;margin-left:5px}.plus{width:32px;height:32px;padding:0;border-radius:50%;font-size:19px}.detailrow.hidden{display:none}.detailrow td{background:var(--card2);padding:0}.detail{padding:10px}.detail table{width:100%;border-collapse:collapse}.detail th,.detail td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
</style></head><body>
<header class="topnav"><div class="brand">PU2PNY-OS<small>Histórico e atividade</small></div><nav class="nav" id="mainNav"></nav><div class="navtools"><span class="pill"><span id="clockLocal">--:--:--</span></span><button class="btn" id="themeToggle">☀ Claro</button></div></header>
<main class="main"><div class="top"><div><h1>Histórico</h1><p>Atividade das últimas 24 horas com a mesma leitura operacional do Ao Vivo.</p></div><button class="btn" id="refresh">Atualizar</button></div>
<section class="section"><div class="grid4"><article class="card"><small class="muted">Eventos</small><div class="big" id="events">0</div></article><article class="card"><small class="muted">RF → Internet</small><div class="big green" id="tx">0</div></article><article class="card"><small class="muted">Internet → RF</small><div class="big red" id="rx">0</div></article><article class="card"><small class="muted">Protocolo mais usado</small><div class="big blue" id="proto">—</div></article></div></section>
<section class="section"><div class="grid2"><article class="card"><h3>Protocolos</h3><div id="protocols"></div></article><article class="card"><h3>Destinos mais usados</h3><div id="targets"></div></article></div></section>
<section class="section"><div class="sectionhead"><h2>Atividade 24h</h2><span class="muted">+ abre os detalhes daquele indicativo</span></div><div class="card" id="groups">Aguardando...</div></section></main>
<script src="/ui-common-0.3.0.js"></script><script>
PNY.nav('history');PNY.initTheme();PNY.startClock();var openRows={};
function duration(sec){sec=Number(sec||0);if(sec<60)return sec.toFixed(0)+' s';return Math.floor(sec/60)+'m '+Math.floor(sec%60)+'s'}
function bars(id,rows){var max=Math.max.apply(null,[1].concat(rows.map(function(x){return x.count})));PNY.q(id).innerHTML=rows.slice(0,12).map(function(x){return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><b>'+PNY.esc(x.name)+'</b><span>'+x.count+'</span></div><div class="bar"><i style="width:'+(100*x.count/max)+'%"></i></div></div>'}).join('')||'<span class="muted">Sem dados.</span>'}
function direction(e){return String(e.direction||'').toUpperCase()==='RF'?'RF → Internet':'Internet → RF'}
function moduleTarget(e){var m=e.module||'',t=e.target||'—';return m?(m+' · '+t):t}
async function load(){
 try{
  var d=await PNY.getj('/api/history/summary'),t=d.totals||{};
  PNY.q('events').textContent=t.events||0;PNY.q('tx').textContent=(t.tx_count||0)+' · '+duration(t.tx_seconds);PNY.q('rx').textContent=(t.rx_count||0)+' · '+duration(t.rx_seconds);PNY.q('proto').textContent=t.most_used_protocol||'—';
  bars('protocols',d.protocols||[]);bars('targets',d.targets||[]);
  var gs=d.groups||[],body=gs.map(function(g,i){
    var items=g.items||[],last=items[0]||{},flag=PNY.flagUrl(g.country_code),key=g.callsign||('row'+i),status=String(last.direction||'').toUpperCase()==='RF'?'TX':'RX';
    var det=items.map(function(e){var o=e.operator||{},rv=e.rssi_avg!=null?e.rssi_avg:e.rssi;return '<tr><td>'+PNY.esc(direction(e))+'</td><td>'+PNY.esc(e.protocol||'—')+'</td><td>'+PNY.esc(e.module||'—')+'</td><td>'+PNY.esc(e.target||'—')+'</td><td>'+PNY.esc(PNY.fmtTime(e.ended_at||e.started_at))+'</td><td>'+duration(e.duration)+'</td><td>'+PNY.esc(e.ber==null?'—':Number(e.ber).toFixed(1)+'%')+'</td><td>'+PNY.esc(rv==null?'—':Number(rv).toFixed(0)+' dBm')+'</td></tr>'}).join('');
    return '<tr><td>'+(i+1)+(flag?'<img class="flag" src="'+PNY.esc(flag)+'" alt="">':'')+'</td><td><span class="statechip '+(status==='TX'?'tx':'rx')+'">'+status+'</span></td><td class="call">'+PNY.esc(g.callsign||'—')+'</td><td>'+PNY.esc(g.name||'—')+'</td><td>'+PNY.esc(g.station_type||'—')+'</td><td class="clip">'+PNY.esc([g.city,g.state].filter(Boolean).join(' / ')||'—')+'</td><td class="clip">'+PNY.esc(g.country||'—')+'</td><td>'+PNY.esc(g.last_protocol||'—')+'</td><td>'+PNY.esc((g.last_module?g.last_module+' · ':'')+(g.last_target||'—'))+'</td><td>'+duration(g.seconds)+'</td><td>'+PNY.esc(PNY.fmtTime(g.last))+'</td><td><button class="btn plus" data-g="'+i+'">'+(openRows[key]?'−':'+')+'</button></td></tr><tr class="detailrow '+(openRows[key]?'':'hidden')+'" id="gd'+i+'"><td colspan="12"><div class="detail"><table><thead><tr><th>Origem</th><th>Protocolo</th><th>Módulo</th><th>Destino</th><th>Horário</th><th>Duração</th><th>BER</th><th>RSSI</th></tr></thead><tbody>'+det+'</tbody></table></div></td></tr>'
  }).join('');
  PNY.q('groups').innerHTML=gs.length?'<div class="tablewrap"><table class="histtable"><thead><tr><th># / País</th><th>Status</th><th>Indicativo</th><th>Nome</th><th>Estação</th><th>Cidade</th><th>País</th><th>Protocolo</th><th>Módulo / TG</th><th>Tempo TX/RX</th><th>Último</th><th>+</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<span class="muted">Sem atividade.</span>';
  PNY.q('groups').querySelectorAll('button[data-g]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.g),g=gs[i],key=g.callsign||('row'+i),row=PNY.q('gd'+i);row.classList.toggle('hidden');if(row.classList.contains('hidden'))delete openRows[key];else openRows[key]=true;b.textContent=row.classList.contains('hidden')?'+':'−'}})
 }catch(e){PNY.q('groups').textContent='Histórico temporariamente indisponível.'}
}
PNY.q('refresh').onclick=load;load();setInterval(function(){if(!document.hidden)load()},20000);
</script></body></html>
