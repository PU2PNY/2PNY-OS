<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PU2PNY — Mais usado</title><link rel="stylesheet" href="/ui-0.3.0.css"><style>.bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.group{border-bottom:1px solid var(--line);padding:10px 0}.gmain{display:grid;grid-template-columns:minmax(160px,1fr) 80px 110px 120px 42px;gap:10px;align-items:center}.detail{display:none;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px}.group.open .detail{display:block}@media(max-width:700px){.gmain{grid-template-columns:1fr 72px 42px}.gmain>*:nth-child(3),.gmain>*:nth-child(4){display:none}}</style></head><body>
<header class="topnav"><div class="brand">PU2PNY-OS<small>Uso e histórico</small></div><nav class="nav" id="mainNav"></nav><div class="navtools"><span class="pill"><span id="clockLocal">--:--:--</span></span><button class="btn" id="themeToggle">☀ Claro</button></div></header>
<main class="main"><div class="top"><div><h1>Mais usado</h1><p>Resumo do seu uso sem repetir o mesmo indicativo dezenas de vezes.</p></div><button class="btn" id="refresh">Atualizar</button></div>
<section class="section"><div class="grid4"><article class="card"><small class="muted">Eventos</small><div class="big" id="events">0</div></article><article class="card"><small class="muted">TX</small><div class="big green" id="tx">0</div></article><article class="card"><small class="muted">RX</small><div class="big red" id="rx">0</div></article><article class="card"><small class="muted">Mais usado</small><div class="big blue" id="proto">—</div></article></div></section>
<section class="section"><div class="grid2"><article class="card"><h3>Protocolos</h3><div id="protocols"></div></article><article class="card"><h3>Destinos mais usados</h3><div id="targets"></div></article></div></section>
<section class="section"><div class="sectionhead"><h2>Indicativos</h2><span class="muted">+ abre todas as transmissões armazenadas para aquele indicativo</span></div><div class="card" id="groups">Aguardando...</div></section></main>
<script src="/ui-common-0.3.0.js"></script><script>
PNY.nav('history');PNY.initTheme();PNY.startClock();
function duration(sec){sec=Number(sec||0);if(sec<60)return sec.toFixed(0)+' s';return Math.floor(sec/60)+'m '+Math.floor(sec%60)+'s'}
function bars(id,rows){var max=Math.max.apply(null,[1].concat(rows.map(function(x){return x.count})));PNY.q(id).innerHTML=rows.slice(0,12).map(function(x){return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><b>'+PNY.esc(x.name)+'</b><span>'+x.count+'</span></div><div class="bar"><i style="width:'+(100*x.count/max)+'%"></i></div></div>'}).join('')||'<span class="muted">Sem dados.</span>'}
async function load(){try{var d=await PNY.getj('/api/history/summary'),t=d.totals||{};PNY.q('events').textContent=t.events||0;PNY.q('tx').textContent=(t.tx_count||0)+' · '+duration(t.tx_seconds);PNY.q('rx').textContent=(t.rx_count||0)+' · '+duration(t.rx_seconds);PNY.q('proto').textContent=t.most_used_protocol||'—';bars('protocols',d.protocols||[]);bars('targets',d.targets||[]);var gs=d.groups||[];PNY.q('groups').innerHTML=gs.map(function(g,i){var items=g.items||[],det=items.map(function(e){return '<tr><td>'+PNY.esc(String(e.mode||e.direction||'').toUpperCase())+'</td><td>'+PNY.esc(e.protocol||'—')+'</td><td>'+PNY.esc(e.target||'—')+'</td><td>'+PNY.esc(PNY.fmtTime(e.ended_at||e.started_at))+'</td><td>'+duration(e.duration)+'</td></tr>'}).join('');return '<div class="group" id="g'+i+'"><div class="gmain"><div><b>'+PNY.esc(g.callsign)+'</b><div class="muted">'+PNY.esc(g.last_protocol||'—')+' · '+PNY.esc(g.last_target||'—')+'</div></div><div>'+g.count+'×</div><div>'+duration(g.seconds)+'</div><div>'+PNY.esc(PNY.fmtTime(g.last))+'</div><button class="btn" data-g="'+i+'">+</button></div><div class="detail"><div class="tablewrap"><table><thead><tr><th>Direção</th><th>Protocolo</th><th>Destino</th><th>Horário</th><th>Duração</th></tr></thead><tbody>'+det+'</tbody></table></div></div></div>'}).join('')||'<span class="muted">Sem atividade.</span>';PNY.q('groups').querySelectorAll('button[data-g]').forEach(function(b){b.onclick=function(){var e=PNY.q('g'+b.dataset.g);e.classList.toggle('open');b.textContent=e.classList.contains('open')?'−':'+'}})}catch(e){PNY.q('groups').textContent='Histórico temporariamente indisponível.'}}
PNY.q('refresh').onclick=load;load();setInterval(function(){if(!document.hidden)load()},20000);
</script></body></html>
